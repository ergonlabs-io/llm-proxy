# Real Envoy field (`CircuitBreakers.per_host_thresholds`) that our lowering
# pass does not map — `circuit_breakers.thresholds` itself IS now supported (S5),
# so this fixture exercises a nested-but-unsupported CB field instead. Ground
# rule #1 says an unhandled field must be rejected with its full dotted path
# rather than silently dropped — this fixture is the `RejectedWithPath`
# outcome-class exemplar for the WP-27 scorecard.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress_tcp
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_tcp
                cluster: backend

  clusters:
    - name: backend
      type: STATIC
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        per_host_thresholds:
          - priority: DEFAULT
            max_connections: 1024
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8081 }
