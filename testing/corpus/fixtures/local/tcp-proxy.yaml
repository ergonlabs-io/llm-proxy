# Phase 1 target config (Gate G1): a plain Envoy bootstrap that llm-proxy must
# accept unmodified — static TCP proxy, round-robin between two upstreams.
# Envoy accepts this file as-is; the WP-27 scorecard and WP-26 diff rig use it.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress_tcp
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_tcp
                cluster: backend

  clusters:
    - name: backend
      type: STATIC
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8081 }
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8082 }
