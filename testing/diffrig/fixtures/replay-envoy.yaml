static_resources:
  listeners:
    - name: replay_envoy
      address:
        socket_address: { address: 0.0.0.0, port_value: 18081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: replay
                route_config:
                  name: replay_routes
                  virtual_hosts:
                    - name: replay
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: replay_upstream }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: replay_upstream
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: replay_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                    address: { socket_address: { address: host.docker.internal, port_value: 18082 } }
