[package]
name = "diffrig"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "diffrig"
path = "src/lib.rs"

[[bin]]
name = "diffrig"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
# WP-50 increment 2a e2e (auth_e2e.rs): compute virtual-key digests
# (hex(HMAC-SHA256(secret, plaintext_key))) at test run time, matching
# `proxy-filters::auth_filter`'s own derivation -- never hardcode a digest,
# see that test file's module doc for why.
ring = { workspace = true }
# swap_under_load.rs: the open-loop, coordinated-omission-aware driver, for
# the non-streaming half of that test's traffic mix (see its module doc for
# why the streaming half is not driven through it).
loadgen = { path = "../loadgen" }

[lints]
workspace = true
