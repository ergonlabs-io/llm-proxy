# `tcp_proxy`'s `weighted_clusters` cluster-specifier (split traffic across
# multiple upstream clusters by weight): real Envoy supports it, but our
# `convert_tcp_proxy` lowering only implements the single-`cluster` variant
# -- expected verdict: GapWeReject at
# `...typed_config.weighted_clusters`.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress_tcp
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_tcp
                weighted_clusters:
                  clusters:
                    - name: backend_a
                      weight: 50
                    - name: backend_b
                      weight: 50

  clusters:
    - name: backend_a
      type: STATIC
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend_a
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8081 }
    - name: backend_b
      type: STATIC
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend_b
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8082 }
