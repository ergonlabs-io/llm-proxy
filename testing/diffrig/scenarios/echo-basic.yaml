# Trivial WP-26 differential scenario: two requests against a proxy fronting
# an `echo` upstream. Used by diffrig's own scenario-parse test today; once
# the proxy driver lands, this is also the rig's self-check fixture.
name: echo-basic
bootstrap:
  path: examples/tcp-proxy.yaml
requests:
  - method: GET
    path: /v1/models
    headers:
      x-test-header: "1"
  - method: POST
    path: /v1/chat/completions
    headers:
      content-type: application/json
    body: '{"model":"gpt-test"}'
upstream:
  type: echo
