name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-go@v5
        with:
          go-version-file: testing/qa/go.mod
          cache-dependency-path: testing/qa/go.sum
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Toolchain versions
        run: rustc --version && cargo --version && cargo nextest --version
      - name: Repository CI checks
        run: make ci
      - name: Redb retention reporter checks
        run: make redb-retention-check

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint and helm template
        run: make helm-check

  # The differential rig job is not wired into CI yet; it would go here (docker-compose: llm-proxy vs pinned
  # Envoy image digest + shared upstreams). Smoke subset on PR, full on merge queue.
