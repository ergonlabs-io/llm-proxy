name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.3.0)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: macos-14
            os: darwin
            arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install protoc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release -p proxy

      - name: Package release asset
        env:
          ASSET_NAME: llm-proxy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
        run: |
          staging="$(mktemp -d)"
          cp target/release/llm-proxy "$staging/llm-proxy"
          tar -C "$staging" -czf "$ASSET_NAME" llm-proxy
          shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: llm-proxy-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            llm-proxy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            llm-proxy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: llm-proxy-*
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --title "llm-proxy ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi

      - name: Update latest tag
        if: secrets.RELEASE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch origin "$RELEASE_TAG"
          git tag -f latest "refs/tags/$RELEASE_TAG"
          git push origin refs/tags/latest --force
