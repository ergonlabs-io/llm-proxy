name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.3.0)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/ergonlabs-io/llm-proxy
  CHART_REPO: oci://ghcr.io/ergonlabs-io/charts

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-14
            os: darwin
            arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install protoc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Build admin UI
        working-directory: admin-ui
        run: npm ci && npm run build

      - name: Build release binary
        run: cargo build --locked --release -p proxy

      - name: Package release asset
        env:
          ASSET_NAME: llm-proxy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
        run: |
          staging="$(mktemp -d)"
          cp target/release/llm-proxy "$staging/llm-proxy"
          cp -R admin-ui/dist "$staging/admin-ui-dist"
          tar -C "$staging" -czf "$ASSET_NAME" llm-proxy admin-ui-dist
          shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: llm-proxy-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            llm-proxy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            llm-proxy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: llm-proxy-*
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --title "llm-proxy ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi

      - name: Update latest tag
        if: env.RELEASE_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch origin "$RELEASE_TAG"
          git tag -f latest "refs/tags/$RELEASE_TAG"
          git push origin refs/tags/latest --force

  # The container image holds the release binaries built above, for
  # linux/amd64 and linux/arm64 (deploy/container/Dockerfile). Pushed with the
  # workflow's own token; no other secret is needed.
  image:
    name: Publish container image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: llm-proxy-linux-*
          merge-multiple: true

      - name: Stage build context
        run: |
          for arch in amd64 arm64; do
            mkdir -p "context/dist/linux-$arch"
            tar -xzf "artifacts/llm-proxy-linux-$arch.tar.gz" -C "context/dist/linux-$arch"
          done
          ls -R context/dist | head -20

      - name: Image tags
        id: tags
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          tags="$IMAGE:$version"
          # A pre-release (v1.2.0-rc.1) does not move `latest`.
          case "$version" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tags=$tags" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile only copies files, so a foreign platform builds
      # without emulation.
      - name: Build amd64 image for the checks
        uses: docker/build-push-action@v6
        with:
          context: context
          file: deploy/container/Dockerfile
          platforms: linux/amd64
          load: true
          tags: llm-proxy:check

      - name: Check the image runs as non-root
        run: |
          user="$(docker image inspect llm-proxy:check --format '{{.Config.User}}')"
          echo "image user: $user"
          case "$user" in 0 | 0:* | root | root:* | "") echo "image must not run as root" >&2; exit 1 ;; esac
          docker run --rm llm-proxy:check --version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: context
          file: deploy/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Links the package to this repository on GHCR.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  chart:
    name: Publish Helm chart
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Check the chart
        run: make helm-check

      # The chart version and appVersion follow the tag, so the chart's
      # default image tag is the image the job above pushed.
      - name: Package and push chart
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          helm package deploy/helm/llm-proxy --version "$version" --app-version "$version" --destination dist
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/llm-proxy-$version.tgz" "$CHART_REPO"
