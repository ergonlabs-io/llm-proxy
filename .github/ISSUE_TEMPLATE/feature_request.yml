name: Feature request
description: Suggest a new capability or a change to an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Read the Limitations page in the documentation first. Many gaps are already known.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do, and why you cannot do it now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How the proxy could solve it. A configuration example helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve the problem that you considered.
