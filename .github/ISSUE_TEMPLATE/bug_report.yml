name: Bug report
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. Follow SECURITY.md instead.
        Remove API keys, virtual keys, and other secrets from everything you paste.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `llm-proxy --version`, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Release binary
        - Container image
        - Helm chart
        - Built from source
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The smallest configuration that shows the problem, with secrets removed.
      render: yaml
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The request you sent (for example the curl command) and the provider it went to.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
      description: What you expected, and what happened. Include the HTTP status, the response body, and the relevant log lines.
    validations:
      required: true
