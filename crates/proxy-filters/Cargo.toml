[package]
name = "proxy-filters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The `ControlPlane` publishes an immutable snapshot
# workers `load()` lock-free -- the same crate `proxy-core::WorkerConfigHandle`
# and `StatHandles` already use for this exact shape.
arc-swap = { workspace = true }
proxy-config = { workspace = true }
proxy-http = { workspace = true }
# `ResponseFlag` (`%RESPONSE_FLAGS%`) -- `token_limit_filter` sets `RL`
# on its own 429 path, same as `proxy-http::router` does for its own flags.
proxy-observability = { workspace = true }
# Usage/token extraction from provider responses.
bytes = { workspace = true }
http = { workspace = true }
prost-reflect = { workspace = true }
# Virtual-key authentication (HMAC-SHA256 + constant-time
# compare). A keyed cryptographic
# hash, NOT `token_limit_filter::hash_credential`'s FNV-1a.
ring = { workspace = true }
# `auth::generate_plaintext_key` -- the single shared
# virtual-key generator, moved here from `crates/proxy/src/keygen.rs` so
# `ControlPlane::mint_key` can call it too.
base64 = { workspace = true }
# The embedded persistent `ControlPlaneStore` -- see
# `control.rs`'s `RedbControlPlaneStore`. `serde` (for `Serialize`/
# `Deserialize` derives on its row types) rides along with it; `serde_json`
# below was already a dependency and does the actual encoding.
redb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
# `RedbControlPlaneStore`'s Redis-backed sibling -- see
# `control_redis.rs`'s module doc for the key layout and why `add_spend`
# needs a Lua script rather than a pipeline.
redis = { workspace = true }
# Warns loudly (rather than failing closed) when a budget applies to a
# request but usage could not be read -- see `token_limit_filter`'s module doc.
tracing = { workspace = true }
# UTC calendar-aligned spend periods
# (`spend::Period::key_for`) -- `proxy-cluster`/`proxy-observability` already
# depend on this for the same reason (wall-clock rendering).
chrono = { workspace = true }
# JWT verification against a statically configured
# JWKS. Pinned to the 9.x line (not the current 11.x) specifically because
# 9.x's default (and only, pre-backend-split) crypto backend is `ring` 0.17 --
# the exact version this workspace already pins for rustls -- so this adds no
# second crypto stack. `jsonwebtoken` 10/11 dropped `ring` entirely in favor of
# `aws_lc_rs` (a C/asm subtree) or a `rust_crypto` feature (a different
# pure-Rust stack: `rsa`/`sha2`/`hmac`/`ed25519-dalek`/`p256`/`p384`), either of
# which would be exactly the "second crypto stack" this task was told to flag
# rather than add unilaterally. Default features (`use_pem`) are turned off:
# this authenticator only ever builds keys from JWKS `n`/`e` components
# (`DecodingKey::from_rsa_raw_components`), never from a PEM file, so
# `pem`/`simple_asn1` would be dead weight.
jsonwebtoken = { version = "9", default-features = false }
# Jitters the policy-poller's interval so N replicas observing the
# same generation bump do not all rebuild at once -- see
# `control.rs::ControlPlane::start_policy_poller`, modeled on
# `proxy-cluster::health_check`'s `next_delay`.
rand = { workspace = true }
# CORS: Envoy StringMatcher supports safe_regex alongside the scalar
# matchers, so accepting its config without compiling it would be a silent
# partial implementation.
regex = { workspace = true }
# OIDC discovery + background JWKS refresh. All
# network crates here were already in the tree (hyper, tokio-rustls, rustls,
# rustls-pemfile, rustls-native-certs) -- this adds edges, not new crates, and
# stays on the workspace's `ring` crypto provider (see `jwt_auth`'s own note
# on why `jsonwebtoken` 9.x is pinned).
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-native-certs = { workspace = true }

[dev-dependencies]
proxy-api = { workspace = true }
# I tests: generates a fresh RSA keypair per test run to
# sign hand-built JWTs -- never commit a private key,
# even a test one, and `proxy-core/tests/tls.rs`'s `RSA_TEST_KEY_PEM`, which
# had to embed one because `ring`/`rcgen` can SIGN with RSA but cannot
# GENERATE an RSA keypair (RSA key generation is out of `ring`'s scope). `rsa`
# (pure Rust, RustCrypto) is used ONLY for key generation and exporting
# PKCS#1 DER / raw (n, e) components in test code; every signature these tests
# produce, and every signature the production `JwtAuthenticator` verifies,
# still goes through `ring` via `jsonwebtoken`.
# `pem` is needed to PARSE the committed PKCS#8 test key (see jwt_auth.rs's
# TEST_KEY_PEM); key GENERATION is no longer used, because 2048-bit RSA keygen
# per nextest process took the workspace suite from ~23s to 60.7s.
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
# Iv tests: generates a localhost TLS cert at test time so
# the mock OIDC server speaks real HTTPS with no committed key material.
rcgen = { workspace = true }

[features]
# Each non-core filter lands behind a feature flag.
default = []

[lints]
workspace = true
