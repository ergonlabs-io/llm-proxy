[package]
name = "proxy-filters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# WP-50 increment 3b-i: the `ControlPlane` publishes an immutable snapshot
# workers `load()` lock-free -- the same crate `proxy-core::WorkerConfigHandle`
# and WP-23's `StatHandles` already use for this exact shape.
arc-swap = { workspace = true }
proxy-config = { workspace = true }
proxy-http = { workspace = true }
# WP-24: `ResponseFlag` (`%RESPONSE_FLAGS%`) -- `token_limit_filter` sets `RL`
# on its own 429 path, same as `proxy-http::router` does for its own flags.
proxy-observability = { workspace = true }
# WP-34 (Lane H): usage/token extraction from provider responses.
bytes = { workspace = true }
http = { workspace = true }
prost-reflect = { workspace = true }
# WP-50 increment 2a: virtual-key authentication (HMAC-SHA256 + constant-time
# compare). See docs/wp-50-auth-design-brief.md for why a keyed cryptographic
# hash and NOT `token_limit_filter::hash_credential`'s FNV-1a.
ring = { workspace = true }
# WP-50 increment 3b-ii: `auth::generate_plaintext_key` -- the single shared
# virtual-key generator, moved here from `crates/proxy/src/keygen.rs` so
# `ControlPlane::mint_key` can call it too.
base64 = { workspace = true }
# WP-50 increment 3b: the embedded persistent `ControlPlaneStore` -- see
# `control.rs`'s `RedbControlPlaneStore`. `serde` (for `Serialize`/
# `Deserialize` derives on its row types) rides along with it; `serde_json`
# below was already a dependency and does the actual encoding.
redb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# WP-34: warns loudly (rather than failing closed) when a budget applies to a
# request but usage could not be read -- see `token_limit_filter`'s module doc.
tracing = { workspace = true }
# WP-50 increment 3c-ii-b: UTC calendar-aligned spend periods
# (`spend::Period::key_for`) -- `proxy-cluster`/`proxy-observability` already
# depend on this for the same reason (wall-clock rendering).
chrono = { workspace = true }
# WP-50 increment 2c-i: JWT verification against a statically configured
# JWKS. Pinned to the 9.x line (not the current 11.x) specifically because
# 9.x's default (and only, pre-backend-split) crypto backend is `ring` 0.17 --
# the exact version this workspace already pins for rustls -- so this adds no
# second crypto stack. `jsonwebtoken` 10/11 dropped `ring` entirely in favor of
# `aws_lc_rs` (a C/asm subtree) or a `rust_crypto` feature (a different
# pure-Rust stack: `rsa`/`sha2`/`hmac`/`ed25519-dalek`/`p256`/`p384`), either of
# which would be exactly the "second crypto stack" this task was told to flag
# rather than add unilaterally. Default features (`use_pem`) are turned off:
# this authenticator only ever builds keys from JWKS `n`/`e` components
# (`DecodingKey::from_rsa_raw_components`), never from a PEM file, so
# `pem`/`simple_asn1` would be dead weight.
jsonwebtoken = { version = "9", default-features = false }

[dev-dependencies]
proxy-api = { workspace = true }
# WP-50 increment 2c-i tests: generates a fresh RSA keypair per test run to
# sign hand-built JWTs -- see the design brief's "never commit a private key,
# even a test one" and `proxy-core/tests/tls.rs`'s `RSA_TEST_KEY_PEM`, which
# had to embed one because `ring`/`rcgen` can SIGN with RSA but cannot
# GENERATE an RSA keypair (RSA key generation is out of `ring`'s scope). `rsa`
# (pure Rust, RustCrypto) is used ONLY for key generation and exporting
# PKCS#1 DER / raw (n, e) components in test code; every signature these tests
# produce, and every signature the production `JwtAuthenticator` verifies,
# still goes through `ring` via `jsonwebtoken`.
# `pem` is needed to PARSE the committed PKCS#8 test key (see jwt_auth.rs's
# TEST_KEY_PEM); key GENERATION is no longer used, because 2048-bit RSA keygen
# per nextest process took the workspace suite from ~23s to 60.7s.
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }

[features]
# Each non-core filter lands behind a feature flag (default-on set decided in WP-31).
default = []

[lints]
workspace = true
