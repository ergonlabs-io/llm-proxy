[package]
name = "proxy-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
proxy-config = { workspace = true }
proxy-http = { workspace = true }
# `TokioIo` adapts the ADS TLS stream to the hyper I/O traits tonic's
# connector requires (`ads_transport`).
hyper-util = { workspace = true }
# Threads the shared ClusterManager through the listener manager into
# the HTTP router terminal.
proxy-cluster = { workspace = true }
# The usage/token filter, registered into the shared
# FilterRegistry below so a `typed_config` can reach it.
proxy-control = { workspace = true }
proxy-filters = { workspace = true }
proxy-xds = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
core_affinity = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
# `SpanSink`/`TraceContext` -- the listener manager threads
# these down to `build_hcm_handler` alongside `RouterStats`/`GenAiTokenStats`.
proxy-observability = { workspace = true }
prost-reflect = { workspace = true }
# The gradual drain's per-request close draw (`drain::drain_close`).
rand = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-native-certs = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tls-parser = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
# The ADS gRPC channel (`ads_transport`).
tonic = { workspace = true }
tracing = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
hyper = { workspace = true }
http-body-util = { workspace = true }
proxy-xds = { workspace = true, features = ["test-support"] }
proxy-api = { workspace = true }
# The ledger tests build their HTTP chain from a dialect config, as production does.
proxy-simple-config = { workspace = true }
# Test helpers build a `StatsControl` to resolve the
# `RouterStats` `initial_bind`/`build_listener_hcm` now require -- production
# code only ever consumed `proxy_http::stat_handles::RouterStats`, already
# reachable via the `proxy-http` dependency above, so this stayed dev-only
# until `proxy-observability` became a real
# `[dependencies]` entry above (`SpanSink`/`TraceContext`); kept here too
# would be a duplicate-key error, not a stricter dev-only bound.
rcgen = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["test-util", "io-util"] }
# Captures the once-only "no connection limit" warning in admission.rs tests.
tracing-subscriber = { workspace = true }
# The ledger tests open a real ledger spool in a temporary directory.
proxy-observability = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
