[package]
name = "proxy-admin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
proxy-credentials = { workspace = true }
proxy-config = { workspace = true }
proxy-core = { workspace = true }
proxy-observability = { workspace = true }
# The admin write API mints/revokes keys and
# edits tenant policy through `proxy_control::control::ControlPlane` -- the
# one type that owns the store and republishes its snapshot.
proxy-control = { workspace = true }
proxy-filters = { workspace = true }
# For `SharedFactoryState`: the admin write handlers resolve the live
# `ControlPlane` out of it per request (see `server.rs`'s `resolve_control_plane`),
# never cache it at `serve()` time -- it does not exist yet when the admin
# server binds (see `server.rs`'s module doc for the boot-order note).
proxy-http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
# The admin bearer-token compare: the double-HMAC constant-time check in
# `server.rs`'s `secrets_match`, never `==`. Same primitive
# (`ring::hmac::verify`) and same reasoning as `proxy_control::auth`'s data-
# plane key check -- see that function's doc.
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Wipes the buffer that held a tenant API key request body (`wipe_body` in
# `server.rs`).
zeroize = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Entry points the cargo-fuzz crate (fuzz/) calls into; see `src/server/fuzzing.rs`.
fuzzing = []

[dev-dependencies]
# `ledger::testing`: a real ledger writer over an encrypted spool in a temp
# dir, so `/ledger/*` tests read and acknowledge real committed entries.
proxy-observability = { workspace = true, features = ["test-support"] }
# `SharedMemoryStore` and its hooks: a store a test can make fail or stall
# inside a real admin write.
proxy-control = { workspace = true, features = ["test-support"] }
tempfile = { version = "=3.27.0", default-features = false }
# The write-API tests build a `ControlPlane` directly and want to name the
# type of `ControlPlane::handle()` (`Arc<ArcSwap<ControlPlaneSnapshot>>`) in
# their own helper signatures -- `proxy-filters` (a real dependency above)
# does not re-export `arc_swap` itself.
arc-swap = { workspace = true }
# `PUT /pricing` tests build the chain's rate card registry through the real
# usage filter factory, which takes its configuration as a dynamic proto message.
proxy-api = { workspace = true }
prost-reflect = { workspace = true }

[lints]
workspace = true
