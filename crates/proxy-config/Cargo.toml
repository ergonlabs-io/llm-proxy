[package]
name = "proxy-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
proxy-api = { workspace = true }
proxy-observability = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true }
prost-types = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
# Parse and check an OAuth2 JWT-bearer signing key at load, so a bad key is a
# config error with its field path. Both crates are already in the tree.
base64 = { workspace = true }
ring = { workspace = true }

[dev-dependencies]
# tests/oauth2_jwt_bearer.rs generates the throwaway RSA key a valid
# `private_key_file` needs (`ring` cannot generate RSA keys).
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
rand = { workspace = true }
prost = { workspace = true }
# Test-only: pins the three llmproxy filter type URLs that `lower.rs` duplicates
# as string literals rather than importing (see `check_lane_h_filter_order`).
# `proxy-filters` depends on `proxy-config`, so the production dependency
# cannot point this way -- a DEV-dependency cycle is legal in cargo and keeps
# the data plane out of the production dependency tree. Same arrangement, and
# same reason, as `proxy-simple-config`'s.
proxy-filters = { workspace = true }

[lints]
workspace = true
