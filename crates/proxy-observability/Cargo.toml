[package]
name = "proxy-observability"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
http = { workspace = true }
# `%START_TIME(fmt)%` strftime rendering.
chrono = { workspace = true }
# Rate-limited warnings when an access-log sink fails to write.
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
# Binary bodies in trace lines (`traces::reassemble`).
base64 = { workspace = true }
# Trace segment codecs, and inflating gzip/deflate bodies off the worker.
flate2 = { workspace = true }
zstd = { workspace = true }
# The S3 trace uploader: its own current-thread runtime, an HTTP/1 client over
# rustls (ring provider, system roots), streaming segment bodies.
bytes = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-native-certs = { workspace = true }
# `stats::Registry` publishes its per-handle metadata and
# shard storage through `ArcSwap<Snapshot>` so resolution can grow the
# registry under `&self`, surviving a config swap -- the same pattern
# `ClusterManager` uses for host sets and the auth filter uses for key sets.
arc-swap = { workspace = true }
# TraceContext::new_root/child need random trace/span
# ids. Already a workspace dependency (proxy-cluster's load balancers,
# proxy-http's request-id generation); this crate had no prior use for it.
rand = { workspace = true }
ring = { workspace = true }
socket2 = { workspace = true }
# SpanSink is a worker -> control mpsc handoff, the same
# shape as the rest of this crate's stats/access-log control-side plumbing.
# The metric exporter adds `time` for `run_metric_exporter`'s own
# `tokio::time::interval` tick and its per-export `tokio::time::timeout`
# deadline. No runtime/macro feature is added: neither exporter task constructs
# or spawns a runtime -- `crates/proxy/src/main.rs` spawns both onto the
# control runtime that is already running.
tokio = { workspace = true, features = ["sync", "time", "rt", "net"] }
# The OTLP/gRPC trace exporter -- `proxy-api` for the
# vendored collector/trace/common/resource message types (see its `build.rs`
# comment on why these cross out of `proxy-api` at all: a hand-rolled
# exporter over the plain generated types, not the opentelemetry SDK, whose
# Send+Sync async providers fight the !Send data plane, ADR-0003), `tonic`
# for the client transport this control-side-only module drives. AGENTS.md
# invariant 2 ("protos never escape proxy-config/proxy-xds") is about ENVOY config
# protos reaching the data plane; this is an outbound telemetry sink the
# control runtime alone drives (see `otlp::run_exporter`'s doc), a different
# protocol serving a different rule.
proxy-api = { workspace = true }
tonic = { workspace = true }
proxy-capture-protocol = { path = "../proxy-capture-protocol" }

# The billing ledger's writer appends to the encrypted spool (ADR-0009).
[target.'cfg(unix)'.dependencies]
proxy-capture-spool = { path = "../proxy-capture-spool" }
# The trace directory's exclusive lock, as `proxy-capture-spool` takes it.
rustix = { version = "=1.1.4", features = ["fs"] }
# `ledger::testing`, behind `test-support`.
tempfile = { version = "=3.27.0", default-features = false, optional = true }

[features]
# Shared test infrastructure for the billing ledger (`ledger::testing`): the
# HTTP and listener tests open a real ledger in a temporary directory.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = { version = "=3.27.0", default-features = false }
# Captures the once-only series-cap warning in stats.rs tests.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
