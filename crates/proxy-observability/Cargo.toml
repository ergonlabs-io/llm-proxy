[package]
name = "proxy-observability"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
http = { workspace = true }
# WP-24: `%START_TIME(fmt)%` strftime rendering.
chrono = { workspace = true }
# WP-24 chunk 2: rate-limited warnings when an access-log sink fails to write.
tracing = { workspace = true }
# WP-23 increment 5: `stats::Registry` publishes its per-handle metadata and
# shard storage through `ArcSwap<Snapshot>` so resolution can grow the
# registry under `&self`, surviving a config swap -- the same pattern
# `ClusterManager` uses for host sets and the auth filter uses for key sets.
arc-swap = { workspace = true }
# WP-51 increment 2: TraceContext::new_root/child need random trace/span
# ids. Already a workspace dependency (proxy-cluster's load balancers,
# proxy-http's request-id generation); this crate had no prior use for it.
rand = { workspace = true }
# WP-51 increment 2: SpanSink is a worker -> control mpsc handoff, the same
# shape as the rest of this crate's stats/access-log control-side plumbing.
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
