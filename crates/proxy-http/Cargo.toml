[package]
name = "proxy-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
proxy-config = { workspace = true }
proxy-observability = { workspace = true }
arc-swap = { workspace = true }
# The router (router.rs) picks a host/pool through the cluster
# manager; pools live in proxy-cluster, their interface is consumed here.
proxy-cluster = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
prost-reflect = { workspace = true }
# The downstream h1 codec and the StreamHandler seam.
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "io-util", "time", "sync"] }
thiserror = { workspace = true }
# S9: per-worker seeding for `x-request-id` generation (headers.rs).
rand = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
ring = { workspace = true }
zeroize = { workspace = true }
serde_json = { workspace = true }
# S3.2 `refused-stream`: the retry engine has to tell an h2 REFUSED_STREAM
# apart from any other send failure, and the only way to do that is to
# downcast the `hyper::Error`'s source chain to the `h2::Error` underneath
# (see `codec::h2_reason`). h2 is NOT a workspace dependency and is not a new
# crate in the tree -- hyper already pulls in this exact version, and the
# downcast is only sound because it is the SAME compiled crate. Two
# semver-incompatible h2 versions would make `downcast_ref` silently return
# `None` and the decode a permanent no-op, so `refused_stream_is_decoded_...`
# in tests/http2_upstream_codec.rs drives a real RST_STREAM end to end rather
# than unit-testing the projection.
h2 = "0.4"

[dev-dependencies]
# Rust note: these power the hyper capability spike
# (tests/hyper_spike.rs) only -- the real data-plane dependency surface above
# is untouched.
tokio = { workspace = true, features = ["macros", "rt", "io-util", "net", "time", "test-util"] }
# Captures the stats recorders' warn-once lines in `stat_handles` tests.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
