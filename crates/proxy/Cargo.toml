[package]
name = "proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "llm-proxy"
path = "src/main.rs"

[dependencies]
# WP-50 increment 2a-iv (`--mode keygen`): base64url-encodes the generated
# key; `ring::rand::SystemRandom` is the CSPRNG that produces its bytes (see
# `src/keygen.rs`'s Rust note for why not `rand::thread_rng`).
base64 = { workspace = true }
clap = { workspace = true }
proxy-admin = { workspace = true }
proxy-cluster = { workspace = true }
proxy-config = { workspace = true }
proxy-core = { workspace = true }
proxy-filters = { workspace = true }
proxy-http = { workspace = true }
proxy-observability = { workspace = true }
proxy-simple-config = { workspace = true }
proxy-xds = { workspace = true }
ring = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# tests/keygen.rs's end-to-end proof (WP-50 acceptance test 4) builds a real
# `HeaderMap` to hand a `VirtualKeyAuthenticator`.
http = { workspace = true }

[lints]
workspace = true
