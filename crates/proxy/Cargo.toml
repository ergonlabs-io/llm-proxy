[package]
name = "proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "llm-proxy"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
proxy-admin = { workspace = true }
proxy-cluster = { workspace = true }
proxy-config = { workspace = true }
proxy-core = { workspace = true }
proxy-control = { workspace = true }
proxy-http = { workspace = true }
proxy-observability = { workspace = true }
proxy-simple-config = { workspace = true }
# Constructs and drives the ADS client from bootstrap
# `dynamic_resources` (see `run_serve`'s `start_ads`). `proxy-api` is a normal
# dependency (not dev-only) because `AggregatedDiscoveryServiceClient`
# (the concrete gRPC client type `proxy-xds::AdsClient::run` is generic over)
# lives there, and this is now the first non-test call site that names it.
proxy-api = { workspace = true }
proxy-xds = { workspace = true }
ring = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# tests/trace_export_e2e.rs reads the gzip segments the binary wrote.
flate2 = { workspace = true }
# `ledger_e2e.rs` reads the spool the binary wrote.
proxy-observability = { workspace = true, features = ["test-support"] }
proxy-capture-spool = { path = "../proxy-capture-spool" }
tempfile = { version = "=3.27.0", default-features = false }
# tests/keygen.rs decodes the printed key's base64url body directly (the
# generator itself now lives in `proxy_control::auth::generate_plaintext_key`,
# which this crate no longer calls outside that test).
base64 = { workspace = true }
# tests/keygen.rs's end-to-end proof builds a real
# `HeaderMap` to hand a `VirtualKeyAuthenticator`.
http = { workspace = true }
# tests/h2_head_limits_e2e.rs drives the downstream HTTP/2 codec with a raw
# h2 client, which sends exactly the header list it is given and surfaces the
# RST_STREAM reason a hyper client hides.
h2 = "0.4"
bytes = { workspace = true }
# tests/stats_e2e.rs's `gen_ai.client.token.usage` case needs a real upstream
# that returns OpenAI-shaped usage -- `mockupstream`'s `mock-upstream` binary
# does that, but it lives in a sibling workspace crate, and Cargo's binary
# artifact dependencies (`artifact = "bin"`) are still nightly-only
# (`-Z bindeps`) as of this toolchain. `serde_json` is what lets the test
# locate that binary robustly instead: it asks `cargo build` itself, via
# `--message-format=json`, for the exact executable path it produced, rather
# than guessing a `target/` layout that a per-worktree `CARGO_TARGET_DIR`
# (see AGENTS.md "Delegation") could change out from under a hardcoded guess.
serde_json = { workspace = true }
# tests/ads_e2e.rs: the puppet ADS server this
# scripts a control plane with -- same dev-only dependency as
# `crates/proxy-xds`'s own tests, not a `workspace.dependencies` entry since
# nothing outside test code needs it (see that crate's Cargo.toml comment).
controlplane = { path = "../../testing/controlplane" }
# tests/ads_e2e.rs's SDS delivery acceptance mints the certificate the
# scripted control plane sends, then makes a real downstream TLS request.
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# tests/ads_e2e.rs: hand-builds a `Cluster` proto and wraps it as a
# `google.protobuf.Any` to script a CDS response directly -- there is no
# bootstrap file on this path, only a resource the ADS client decodes off
# the wire, same idiom as `crates/proxy-xds/tests/apply.rs`'s own fixtures.
prost = { workspace = true }
prost-types = { workspace = true }
# tests/ads_e2e.rs encodes an `llmproxy.auth` typed_config, which has no
# generated Rust type, from `proxy_api::descriptor_pool()`.
prost-reflect = { workspace = true }
# tests/otlp_trace_e2e.rs's mock OTLP collector: a real `TraceServiceServer`
# (generated in `proxy-api`) served over a real ephemeral `tonic` endpoint --
# the only way to prove spans actually cross the wire in the shape a real
# collector expects, rather than asserting against `FinishedSpan` (which
# `otlp::map_span` already unit-tests without any network at all). The ADS
# channel itself is built in `proxy_core::ads_transport`, so `tonic` is a test
# dependency here.
tonic = { workspace = true }
# tests/oauth2_token_e2e.rs generates the throwaway RSA keys its mock token
# endpoint checks assertions against (`ring` cannot generate RSA keys).
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
rand = { workspace = true }

[lints]
workspace = true
