// Downstream authentication for the llm-proxy data plane (WP-50 increment 2a).
//
// This is the FIRST vendored Lane-H proto -- WP-47 increment 1. Every Lane-H
// filter before it borrowed an unrelated already-compiled Envoy message and
// read fields whose names happened to fit (`llmproxy.usage` reads
// `DataSource.inline_string`; `llmproxy.body_rewrite` reads
// `RuntimeFeatureFlag.default_value`; `llmproxy.token_limit` reads
// `RateLimitSettings.max_tokens`/`fill_rate`, which is really Envoy's xDS
// discovery-throttling config). Those three borrows still stand and their
// migration remains WP-47's own scope; this file exists because the fourth
// filter could not be built that way at all:
//
//   - Authentication config is a REPEATED STRUCTURED record (key id, tenant,
//     digest, revoked). No compiled Envoy message has that shape, so the only
//     way to borrow one would have been a JSON blob inside a string field.
//   - That blob would carry CREDENTIAL MATERIAL through a field nothing
//     validates. WP-47 already raises exactly this objection about provider
//     credentials travelling as an unvalidated `google.protobuf.Struct`: a typo
//     in the shape is a silent auth failure. Repeating it here, for the keys
//     that guard the proxy itself, was not defensible.
//
// The `llmproxy.filters.v0` package is deliberately versioned from the start:
// v0 signals that the shape is not yet frozen, and gives WP-47's migration of
// the other three filters somewhere to land without renaming this one.

syntax = "proto3";

package llmproxy.filters.v0;

import "envoy/config/core/v3/base.proto";

// Configures the downstream authentication filter.
//
// The filter resolves an inbound request to a caller identity or refuses the
// request. It fails CLOSED: with this filter in the chain, a request that
// presents no recognized credential is refused, never admitted anonymously.
// (Authorization is the opposite axis and defaults OPEN -- an authenticated
// tenant with no configured policy may use every model and provider. See
// `docs/wp-50-auth-design-brief.md`.)
message Authentication {
  // Required. The operator secret that keys the HMAC over virtual keys.
  //
  // A `DataSource` rather than an inline string so the secret can live in a
  // file instead of the config document.
  //
  // Supported specifiers are `filename` and `inline_string`, and ONLY those
  // two -- not because this filter could not read the others, but because
  // `DataSource`'s supported surface is declared once for the whole project
  // (`proxy-config`'s `allowed_fields`), and `environment_variable` /
  // `inline_bytes` are not implemented at the sites where `DataSource` already
  // appears (TLS certificates, `direct_response` bodies). Widening the entry
  // here would silently claim support at those sites too. A config that sets
  // either one is rejected with its dotted path rather than ignored.
  //
  // `watched_directory` is likewise not supported: rotating this secret
  // invalidates every configured digest at once, so it is a deliberate
  // reconfiguration, not something to pick up from a file-move event.
  envoy.config.core.v3.DataSource hmac_secret = 1;

  // The configured virtual keys.
  //
  // May be empty. An `Authentication` filter with no keys authenticates
  // nothing and therefore refuses everything -- which is the correct reading
  // of "authentication is enabled, and no credential is valid", not a
  // misconfiguration to be rescued by admitting traffic.
  repeated VirtualKey virtual_keys = 2;

  // Where the control plane's minted keys, revocations, and tenant policy
  // live. UNSET means `in_memory` -- every config written before this field
  // existed keeps working unchanged, with the same behavior it always had.
  //
  // Exactly one `ControlPlane` is built per serve, not per worker: the HTTP
  // filter chain is rebuilt once per worker (ADR-0003), but `AuthFilterFactory`
  // resolves this store through the shared per-serve slot
  // (`SharedFactoryState`, see `auth_filter.rs`) so it is opened exactly once
  // regardless of worker count. This matters concretely for `persistent`:
  // `redb` takes a file lock on open, so a second, per-worker open of the same
  // path would fail outright rather than share the first one.
  oneof store {
    InMemoryStore in_memory = 3;
    PersistentStore persistent = 4;
    SharedStore shared = 6;
  }

  // How often this replica polls the store's policy generation stamp (tenant,
  // key, and budget writes -- see `ControlPlaneStore::policy_generation`), in
  // seconds. `0` (proto3's implicit default for an unset `uint32`) means "use
  // the built-in default of 48 seconds".
  //
  // Unlike `flush_interval_seconds` on `SpendLimit`, this IS a correctness
  // knob, not just a durability one: it is the propagation bound of a
  // security control. The interval is jittered by up to a quarter of itself
  // so that N replicas observing the same write do not all rebuild at once
  // (ADR-0006 §3) -- and that means **a revoked key stops working within
  // `poll_interval_seconds` × 1.25, which is 60 seconds at the default.**
  uint32 poll_interval_seconds = 5;

  // WP-50 increment 2c-ii: JWT providers verified against statically
  // configured JWKS (RS256 only). Each entry becomes one `JwtAuthenticator`
  // appended to the filter's `AuthenticatorChain` AFTER the virtual-key
  // authenticator: `Bearer llmp_...` stays virtual-key territory, every other
  // `Bearer` value is claimed as a JWT by the first JWT provider in order.
  // May be empty (no JWT accepted). Clock skew uses the authenticator's
  // built-in default; OIDC discovery / background refresh is a later
  // increment, not this field.
  repeated JwtProvider jwt_providers = 7;
}

// Keeps every minted key, revocation, and tenant policy only in process
// memory -- nothing survives a restart. This is the right default for a
// single-process deployment that bootstraps its keys entirely from
// `virtual_keys` above and never mints or revokes at runtime; it is the wrong
// choice for anything that does, since every key minted through an admin API
// is lost the moment the process exits.
message InMemoryStore {}

// Persists every minted key, revocation, and tenant policy to an embedded
// `redb` database file, surviving a restart.
message PersistentStore {
  // Required. Path to the `redb` database file. It is created if it does not
  // already exist. Must not be empty -- an empty path is a configuration
  // error, not a fallback to `in_memory`: silently downgrading durability
  // because of a typo'd path would lose every key minted at runtime with
  // nothing in the logs to explain why.
  string path = 1;
}

// Shares every minted key, revocation, and tenant policy across every
// replica through Redis (`RedisControlPlaneStore`, WP-62) -- the multi-
// replica counterpart to `persistent` above. Where `persistent` gives ONE
// process durability across its own restarts, `shared` gives EVERY replica
// the same view: a key revoked on one replica is refused by all of them
// within `poll_interval_seconds`, and accrued spend from every replica
// converges on one total rather than each enforcing against its own traffic
// alone. See `internal-docs/adr/0006-shared-state-tiers.md` for the full
// tier taxonomy this sits in.
message SharedStore {
  // Required. The Redis connection URL (e.g.
  // `redis://:password@host:6379/0`).
  //
  // A `DataSource` for exactly the reason `hmac_secret` above is one: a
  // Redis URL may embed a password, so it must be able to live in a file
  // instead of the config document.
  //
  // Supported specifiers are `filename` and `inline_string`, and ONLY those
  // two, for the same reason `hmac_secret` gives: `DataSource`'s supported
  // surface is declared once for the whole project (`proxy-config`'s
  // `allowed_fields`), and widening it here would silently claim
  // `environment_variable` support at the TLS and `direct_response` sites
  // too. A config that sets either one is rejected with its dotted path
  // rather than ignored.
  envoy.config.core.v3.DataSource url = 1;

  // Optional. Prefixes every Redis key this store touches, so two
  // deployments (or two test runs) can share one Redis without their keys
  // colliding. Defaults to `RedisControlPlaneStore::DEFAULT_NAMESPACE`
  // (`"llmproxy"`) when unset or empty.
  string namespace = 2;
}

// One virtual key. The plaintext key NEVER appears in configuration.
message VirtualKey {
  // Required. Names this credential in audit logs and in
  // `%RESPONSE_CODE_DETAILS%`. Must be unique within one filter config.
  //
  // Separate from `tenant` on purpose: revoking one leaked key must not revoke
  // the whole account, and an audit trail needs to name the key rather than
  // just the account it belongs to.
  string key_id = 1;

  // Required. The tenant (account/team) this key authenticates as. Several
  // keys may share a tenant; that is the normal case.
  string tenant = 2;

  // Required. Lowercase hex of `HMAC-SHA256(hmac_secret, <plaintext key>)`,
  // exactly 64 characters.
  //
  // The digest, not the key: the plaintext is shown to the operator once, at
  // creation, and is never recoverable from configuration. A keyed HMAC (not a
  // bare SHA-256) means read access to this file does not by itself permit
  // offline precomputation of matching keys.
  //
  // Hex rather than a proto `bytes` field, which the proto3 JSON mapping would
  // render as base64: a hex digest is greppable in incident response and can
  // be compared by eye against a `sha256`/`openssl dgst` transcript, which is
  // how an operator will actually verify one.
  string digest_hex = 3;

  // A revoked key is refused. It stays in the configuration deliberately: the
  // distinction between "unknown key" and "revoked key" is what lets an
  // operator tell a compromised credential still being tried from a caller who
  // simply typed the wrong thing. The DOWNSTREAM response is identical for
  // both -- the difference reaches the access log, never the caller.
  bool revoked = 4;
}

// WP-50 increment 2c-ii: one JWT issuer accepted by the filter, verified
// against a statically configured key set (RS256 only). One entry becomes one
// `JwtAuthenticator` on the chain; entries are tried in config order and the
// first terminal outcome wins (same `Rejected`-stops-the-chain rule as the
// virtual-key authenticator).
message JwtProvider {
  // Required. Which claim in a verified token becomes the llm-proxy tenant.
  // Never defaulted: a verified token missing this claim (or carrying it as
  // an empty string) is rejected.
  string tenant_claim = 1;

  // Optional. When set (non-empty), the token's `iss` must equal this value,
  // and a token omitting `iss` is rejected. When unset, no issuer check is
  // applied.
  string issuer = 2;

  // Optional. When set (non-empty), the token's `aud` must contain this
  // value, and a token omitting `aud` is rejected. When unset, no audience
  // check is applied.
  string audience = 3;

  // The static key set. Must contain at least one key: a provider with no
  // keys verifies nothing and therefore refuses everything it claims, which
  // is a misconfiguration, not a fail-closed policy.
  repeated JwtKey keys = 4;

  // Optional. Maps a verified token's tenant-claim VALUE to the llm-proxy
  // tenant to admit it as (e.g. an Entra `tid` -> `acme`). When empty, the
  // claim value is used directly as the tenant. When non-empty, a verified
  // token whose claim value appears in no entry is rejected
  // (`JwtTenantNotMapped`): a non-empty map means "only these mappings",
  // so an arbitrary issuer-side value (any Entra tenant's `tid`) can never
  // become an implicitly trusted llm-proxy tenant.
  map<string, string> tenant_values = 5;

  // Optional. OIDC discovery URL for this provider (e.g. an Entra tenant's
  // `.../v2.0/.well-known/openid-configuration`). When set, a background
  // thread fetches the discovery document, follows its `jwks_uri`, and
  // republishes the key set every `refresh_interval_seconds` -- request
  // workers never fetch. Must use the `https` scheme. When set, `keys` above
  // may be empty (the first refresh populates the set; until then every JWT
  // for this provider is refused); without it, `keys` must be non-empty.
  string discovery_url = 6;

  // How often the background JWKS refresh runs, in seconds. `0` (proto3's
  // implicit default) means the built-in default of 600 seconds. Only read
  // when `discovery_url` is set. A snapshot older than six consecutive
  // missed refreshes is refused rather than served (`JwtJwksStale`).
  uint32 refresh_interval_seconds = 7;

  // Optional. PEM bundle of CA certificates to trust for the discovery and
  // JWKS fetches, instead of the system roots (e.g. a TLS-intercepting
  // enterprise proxy, or a test CA). Same `DataSource` shape and
  // `filename`/`inline_string`-only rule as `hmac_secret`.
  envoy.config.core.v3.DataSource trusted_ca = 8;

  // Optional claim identifying the individual or workload principal. When
  // configured, it is combined with issuer and tenant to form the stable
  // accounting identity; use Entra's `oid` for workforce tokens. Without it,
  // legacy `kid` identity remains for compatibility.
  string subject_claim = 9;
}

// One RSA public key in a `JwtProvider`'s static set, as base64url-encoded
// `n`/`e` text (the JWKS document's own encoding). The filter decodes both
// at config load; undecodable text is a load error naming its dotted path.
message JwtKey {
  // Required. Selects this key at verification time against a token's `kid`
  // header. Must be unique within its provider.
  string kid = 1;

  // Required. RSA modulus, base64url (RFC 4648 §5) without padding.
  string n = 2;

  // Required. RSA public exponent, base64url (RFC 4648 §5) without padding.
  string e = 3;
}
