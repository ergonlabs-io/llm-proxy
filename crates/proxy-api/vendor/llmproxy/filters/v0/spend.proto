// The price table for the spend-budget filter (WP-50 increment 3c-i).
//
// Vendored for its own sake, same reasoning as `auth.proto` and
// `model_authz.proto`: a price table is a REPEATED STRUCTURED record
// (cluster, model, four independent per-bucket rates), which no existing
// compiled Envoy message shapes, and it feeds a subsystem whose entire job is
// to be right about money -- not something to carry as an unvalidated JSON
// blob inside a borrowed field.
//
// See `internal-docs/IMPLEMENTATION_PLAN.md`, normative for this file.

syntax = "proto3";

package llmproxy.filters.v0;

// The configured price table for the spend-budget filter (`llmproxy.spend_limit`).
//
// This message answers "what did this request cost" (`pricing`) and "what
// reporting period does an unbudgeted tenant's spend accrue into"
// (`default_period`). It deliberately does NOT carry the ceiling itself --
// see this message's "Where the ceiling lives" note below -- and by 3c-ii it
// also does not accumulate spend or enforce anything; 3c-iii-b is the filter
// that reads this config, resolves the shared `SpendAccumulator` singleton,
// and does both.
message SpendLimit {
  // The configured per-cluster price lists. An entry for a cluster that is
  // never actually dialled by a request is simply never charged -- see
  // `ClusterPricing.cluster`'s doc for why cluster names are not
  // cross-checked against the snapshot at load.
  repeated ClusterPricing pricing = 1;

  // The reporting period a tenant's spend accrues into when that tenant has
  // NO configured `TenantBudget` -- see `proxy_filters::spend::TenantBudget`
  // for why a budget's OWN period always wins when one exists: this field is
  // a fallback for spend HISTORY to have somewhere to accrue, never a value
  // that overrides a tenant's actual budget period. `PERIOD_UNSPECIFIED`
  // (proto3's implicit zero value for an unset enum) means `MONTHLY`, not an
  // error -- an operator who never thinks about this field gets the coarser,
  // less surprising default rather than a load-time failure over a knob most
  // deployments will never touch.
  Period default_period = 2;

  // How often the in-memory spend accumulator flushes to the
  // `ControlPlaneStore`, in seconds. `0` (proto3's implicit default for an
  // unset `uint32`) means "use the built-in default of 5 seconds" -- this is
  // a durability knob, not a correctness one (see "Enforcement reads live
  // memory" below), so treating unset as "pick a sane default" is safe in a
  // way an unset ceiling or an unset price would not be.
  uint32 flush_interval_seconds = 3;

  // How long this replica may go without RECONCILING with the shared store
  // before it says so, in seconds. `0` (proto3's implicit default) means the
  // built-in 60 seconds. WP-62, ADR-0006 section 5.
  //
  // "Reconciling" means a flush in which every bucket was written and the
  // store handed back the authoritative total -- see
  // `proxy_filters::spend::SpendAccumulator::flush_now`. Past this bound the
  // replica's view of a shared budget may be missing what OTHER replicas
  // spent, so the budget can be over-admitted by roughly
  // `(replicas - 1) x per-replica spend` for the duration. The proxy warns,
  // counts the admissions it made while stale, and reports both through the
  // admin spend read.
  //
  // A durability/visibility knob, not a correctness one, so unset picks a
  // default instead of failing the load -- the same reasoning as
  // `flush_interval_seconds` above. Note the default deliberately does not
  // scale with `flush_interval_seconds`: a staleness bound that silently
  // moved when an unrelated knob changed is worse than a stated one, and
  // ADR-0006 section 4 requires each staleness bound to be stated
  // separately.
  uint32 reconciliation_bound_seconds = 4;

  // What this replica does once `reconciliation_bound_seconds` has elapsed.
  // `ON_RECONCILIATION_EXPIRED_UNSPECIFIED` means `ALLOW`.
  OnReconciliationExpired on_reconciliation_expired = 5;

  // Optional per-replica/chain redb file. The flusher checkpoints pending deltas
  // and exact retry tokens before Redis I/O. Keep this file on durable storage
  // across restarts and use a stable, unique service_node. Empty disables it.
  // Requests since the last checkpoint remain volatile; no request-path disk I/O.
  string recovery_journal_path = 6;

  // Required opt-in when legacy tenant budgets exist. START_KEYS_FRESH retains
  // tenant history while explicitly starting key enforcement; never copies totals.
  LegacyTenantBudgetCutover legacy_tenant_budget_cutover = 7;
}

// What a replica does when its spend state is stale -- ADR-0006 section 5.
//
// Only `ALLOW` is implemented. `DENY` and `DEGRADE` are named here on
// purpose, so that tightening the policy later is a config value rather than
// a redesign of this message; until they are implemented, selecting one is a
// LOAD ERROR naming this field, never a silent downgrade to `ALLOW` (ground
// rule 1: silently ignoring a config field is a P0 bug).
//
// This mirrors Envoy's newer rate-limit-quota filter's expired-assignment
// behaviour. Check that filter's exact field naming against the targeted
// Envoy version before treating these names as final.
enum OnReconciliationExpired {
  // proto3's implicit zero value. Means `ALLOW`, which is also what an
  // operator who never touches this field wants: a metering hiccup must not
  // start refusing traffic.
  ON_RECONCILIATION_EXPIRED_UNSPECIFIED = 0;

  // Keep serving. Each replica keeps enforcing against the last total the
  // store confirmed plus its own accrual since, so a replica that has burned
  // the budget on its OWN traffic still returns 429. This is strictly better
  // than Envoy's global rate limit filter under an outage, which holds no
  // counter state and admits everything.
  ALLOW = 1;

  // NOT IMPLEMENTED -- rejected at config load. Refuse requests for tenants
  // with a configured budget while the replica is stale.
  DENY = 2;

  // NOT IMPLEMENTED -- rejected at config load. Reserved for a partial
  // enforcement mode (for example, admitting only up to this replica's own
  // share of the ceiling).
  DEGRADE = 3;
}

// A calendar-aligned accounting window. See
// `proxy_filters::spend::Period` -- this enum is this proto's mirror of that
// Rust type, converted once at config load, never carried through to the
// data plane as a raw integer.
enum Period {
  // proto3's implicit zero value. Never a real choice at the data-plane
  // level; wherever this enum is read, `PERIOD_UNSPECIFIED` is translated to
  // a concrete default appropriate to that field (see `default_period`
  // above) rather than left as a third, ambiguous "period".
  PERIOD_UNSPECIFIED = 0;
  DAILY = 1;
  MONTHLY = 2;
}

// Where the ceiling itself lives, and why not here
//
// A tenant's spend CEILING (`TenantBudget` -- `max_micros` + its own
// `period`) is deliberately NOT a field on `SpendLimit`, unlike the price
// table above. It lives in the control plane
// (`proxy_filters::control::ControlPlane`, beside `ModelAccess`) and is set
// through the admin API (`PUT /chains/{stat_prefix}/tenants/{id}/budget`),
// the same seam WP-50 3b already uses for per-tenant model allow-lists.
//
// Two reasons, not one:
//
// - **A ceiling is per-TENANT, not per-deployment.** `SpendLimit` is one
//   filter's static `typed_config`, shared by every tenant that chain
//   serves; a ceiling that varies by tenant cannot be expressed as a single
//   scalar on it without inventing a second, redundant tenant list this
//   message would then have to keep in sync with the control plane's own.
// - **A ceiling changes far more often than prices do, in production, by an
//   operator responding to a specific tenant's usage** -- exactly the "take
//   effect on the next request with no reload" property WP-50 3b built the
//   admin write API and `ControlPlaneSnapshot` republish path for. Bootstrap
//   config is the wrong tool for a value that is expected to change while
//   the process is running; prices, by contrast, are close to static
//   deployment facts, which is why they DO belong in `typed_config`.

// One cluster's price list.
//
// CLAUDE.md ground rule 6 ("anything that varies per provider belongs on the
// cluster, never on the route") has a third instance here, beyond credentials
// (WP-35 1a) and `host_rewrite_literal` (WP-35 2c): pricing. The same model
// name can be served by two clusters at two different rates -- `gpt-4o`
// direct versus through a discounted secondary, say -- and a route only picks
// an *aggregate*; the cluster is the *member* that actually gets dialled. A
// price keyed on model alone (or, worse, attached to a `RouteEntry`) would
// bill the primary's rate for a request the fallback actually served. That is
// not a rounding error -- it is silently wrong billing, and it would only
// show up when a failover happened.
//
// So pricing here is keyed on `cluster`, and the filter resolves it (in a
// later increment) against `StreamInfo::upstream_cluster` -- the cluster the
// router actually dialled, never the route's intended target. Nothing here
// forces this field to name a cluster that exists in `static_resources`; a
// typo'd or stale name is simply never matched at cost time, which is the
// same "absent price is zero" semantic as an unpriced model (see
// `ModelPrice`'s doc), not a separate failure mode to detect in this
// increment.
message ClusterPricing {
  // Required, non-empty. The cluster name this price list applies to -- must
  // match a `StreamInfo::upstream_cluster` value to ever be charged.
  string cluster = 1;

  // This cluster's per-model prices. A model absent from this list costs
  // zero on this cluster -- see `ModelPrice`'s doc.
  repeated ModelPrice models = 2;
}

// One model's per-token-bucket prices, on one cluster.
message ModelPrice {
  // Required, non-empty. Matched EXACTLY against the request's resolved
  // model name -- deliberately unlike `model_authz.proto`'s `OnlyModels`,
  // which allows one trailing `*` glob. A glob here would let one pattern
  // match two models priced differently (`gpt-4*` matching both `gpt-4o` and
  // `gpt-4-turbo` at, say, different rates), which would make the charged
  // rate depend on iteration order over this list -- an unreproducible wrong
  // answer in the one subsystem that must never produce one. So: exact match
  // only, and a model this filter has never heard of is unpriced (zero), not
  // an error -- see the semantics below.
  string model = 1;

  // The four fields below are decimal strings (e.g. `"2.50"`), not `double`.
  // Money in binary floating point does not round-trip -- `0.1 + 0.2` is
  // already not exactly `0.3` in IEEE 754 -- and a spend ceiling compared
  // against a value that drifted through repeated float arithmetic is an
  // unreproducible wrong answer, in the one subsystem whose entire job is to
  // be right about money. Each string is parsed EXACTLY ONCE, at config load,
  // into an integer number of micro-dollars (1e-6 USD); every operation after
  // that point is integer arithmetic. See `proxy_filters::spend` for the
  // parser and its documented rejection rules (more than six decimal places,
  // a sign, non-numeric input, overflow).
  //
  // All four buckets are priced independently because providers price them
  // independently: a cache-read token is typically billed at a steep
  // discount off the base input rate, and a cache-write token at a premium
  // over it. Charging cached tokens at the input rate -- collapsing the four
  // buckets into two -- overcharges heavily on cache-heavy workloads, which
  // is exactly the workload a proxy like this attracts. Each field is
  // REQUIRED to be an explicit, valid decimal string -- an unset (empty)
  // field is rejected by `parse_micro_usd`, not silently treated as a
  // `"0.00"` rate, so a `ModelPrice` entry that forgot a bucket fails loudly
  // at config load rather than quietly undercharging that bucket forever.
  // To price a bucket at zero deliberately, write `"0.00"` for it. This is
  // unrelated to a `ModelPrice`/`ClusterPricing` entry being absent
  // entirely, which is the distinct "unpriced" semantic described above.

  // Price per 1,000,000 standard (non-cached) input tokens.
  string input_per_million = 2;
  // Price per 1,000,000 output/completion tokens.
  string output_per_million = 3;
  // Price per 1,000,000 cache-READ input tokens.
  string cached_per_million = 4;
  // Price per 1,000,000 cache-WRITE input tokens.
  string cache_creation_per_million = 5;
}

// Existing aggregate tenant history cannot establish per-key charges.
enum LegacyTenantBudgetCutover {
  LEGACY_TENANT_BUDGET_CUTOVER_UNSPECIFIED = 0;
  START_KEYS_FRESH = 1;
}
