[package]
name = "proxy-simple-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
proxy-config = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
# Header names and values are checked at load with the same parser the router
# uses, so a value the router cannot send is a load error.
http = { workspace = true }

[features]
default = []
# Entry points the cargo-fuzz crate (fuzz/) calls into; see `src/fuzzing.rs`.
fuzzing = []

[dev-dependencies]
# tests/oauth2_jwt_bearer.rs generates the throwaway RSA key a valid
# `private_key_file` needs (`ring` cannot generate RSA keys).
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
rand = { workspace = true }
# Test-only: pins the usage filter's type URL, which `lower.rs` duplicates as a
# literal rather than importing (see the comment on `USAGE_FILTER_TYPE_URL`).
# A dev-dependency keeps the data plane out of the production dependency tree.
proxy-filters = { workspace = true }
# Test-only: driving a REAL request through a
# dialect-lowered config end to end (filter chain + router + cluster
# manager), so the body-based-routing test exercises the actual join
# between `MODEL_HEADER` (this crate) and the header `proxy-filters`
# publishes, rather than asserting on either literal in isolation. See
# `tests/dialect.rs`'s `body_based_model_routing_reaches_the_right_provider`.
proxy-http = { workspace = true }
proxy-cluster = { workspace = true }
# Test-only: `RouterFilterFactory` requires a
# `RouterStats`, built here the same way `crates/proxy/src/main.rs` does at
# boot.
proxy-observability = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "io-util", "net", "time"] }
# Test-only: `tests/auth.rs` computes the SAME
# HMAC-SHA256 digest `auth_filter::parse_config` verifies against, so its
# fixtures exercise the real filter rather than a value nobody checked.
ring = { workspace = true }
# Test-only: `tests/schema_gate.rs` validates every dialect example against
# the normative schema (AGENTS.md invariant 5).
jsonschema = { workspace = true }

[lints]
workspace = true
