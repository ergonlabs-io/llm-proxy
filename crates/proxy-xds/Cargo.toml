[package]
name = "proxy-xds"
version.workspace = true
edition.workspace = true
license.workspace = true

# The ADS gRPC pump (client.rs) does not use `proxy-config`: validation is
# injected as a callback. apply.rs is the one place a `DiscoveryResponse`
# actually becomes a `proxy_config::ir::ConfigSnapshot`, so this crate takes
# the `proxy-config` edge, and the proto boundary widens from `proxy-config`
# to `proxy-config`/`proxy-xds` here, as AGENTS.md invariant 2 says.
[dependencies]
proxy-api = { workspace = true }
proxy-config = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
# The reconnect loop's real RNG and its `warn!` when a stream ends.
rand = { workspace = true }
tracing = { workspace = true }
# Decoding `google.protobuf.Any` resources into typed protos
# before handing them to `proxy-config`'s `lower_dynamic_*`.
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
# The puppet ADS server the tests run the pump against over a real loopback
# socket. Not a workspace.dependencies entry: nothing
# else depends on it yet (see testing/controlplane's own Cargo.toml).
controlplane = { path = "../../testing/controlplane" }

[lints]
workspace = true

[features]
test-support = []
