[package]
name = "proxy-xds"
version.workspace = true
edition.workspace = true
license.workspace = true

# WP-20 increment 3a adds the first real code (the ADS gRPC request/response
# pump), so this crate now has real edges. `proxy-config` is deliberately
# still NOT one of them: validation is injected as a callback rather than
# implemented here (see client.rs), which is what keeps this crate free of
# ground-rule #2's proto boundary until increment 4 wires real validation.
[dependencies]
proxy-api = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The WP-28 puppet ADS server this increment's tests run the pump against
# over a real loopback socket. Not a workspace.dependencies entry: nothing
# else depends on it yet (see testing/controlplane's own Cargo.toml).
controlplane = { path = "../../testing/controlplane" }

[lints]
workspace = true
