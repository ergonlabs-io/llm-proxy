[package]
name = "proxy-xds"
version.workspace = true
edition.workspace = true
license.workspace = true

# WP-20 increment 3a added the first real code (the ADS gRPC request/response
# pump); `proxy-config` was deliberately NOT one of its edges, since
# validation was injected as a callback rather than implemented there (see
# client.rs). Increment 4b-ii is where this crate finally takes that edge:
# apply.rs is the one place a `DiscoveryResponse` actually becomes a
# `proxy_config::ir::ConfigSnapshot`, so ground-rule #2's proto boundary
# widens from "`proxy-config`" to "`proxy-config`/`proxy-xds`" here, exactly
# as PLAN.md Part 0 always said it would.
[dependencies]
proxy-api = { workspace = true }
proxy-config = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
# increment 3b: the reconnect loop's real RNG and its `warn!` when a stream ends.
rand = { workspace = true }
tracing = { workspace = true }
# increment 4b-ii: decoding `google.protobuf.Any` resources into typed protos
# before handing them to `proxy-config`'s `lower_dynamic_*`.
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
# The WP-28 puppet ADS server this increment's tests run the pump against
# over a real loopback socket. Not a workspace.dependencies entry: nothing
# else depends on it yet (see testing/controlplane's own Cargo.toml).
controlplane = { path = "../../testing/controlplane" }

[lints]
workspace = true

[features]
test-support = []
