apiVersion: v2
name: llm-proxy
description: High-performance proxy for LLM inference APIs, configured with the llm-proxy --config dialect.
type: application
# The release workflow sets both from the git tag when it packages the chart
# (`helm package --version --app-version`). Keep them equal to VERSION.
version: 0.6.1
appVersion: "0.6.1"
# The preStop hook uses the `sleep` lifecycle action, so the image needs no
# shell. Kubernetes enables it by default from 1.30.
kubeVersion: ">=1.30.0-0"
home: https://github.com/ergonlabs-io/llm-proxy
sources:
  - https://github.com/ergonlabs-io/llm-proxy
keywords:
  - llm
  - proxy
  - gateway
  - openai
  - anthropic
