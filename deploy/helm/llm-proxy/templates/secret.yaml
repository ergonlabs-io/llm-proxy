{{- if and .Values.secret.create .Values.secret.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-proxy.secretName" . }}
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secret.env }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.sharedStore.enabled (not .Values.sharedStore.existingSecret) }}
{{- if not .Values.sharedStore.url }}
{{- fail "sharedStore.enabled needs sharedStore.existingSecret or sharedStore.url" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-proxy.redisSecretName" . }}
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.sharedStore.key }}: {{ .Values.sharedStore.url | quote }}
{{- end }}
