apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-proxy.fullname" . }}
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "llm-proxy.selectorLabels" . | nindent 4 }}
  # Client traffic only. The admin port stays off the Service.
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if eq .Values.workload "StatefulSet" }}
---
# Governs the StatefulSet's pod DNS names. Not for client traffic.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-proxy.fullname" . }}-headless
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "llm-proxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
      protocol: TCP
{{- end }}
