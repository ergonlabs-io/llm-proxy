# helm lint / helm template coverage: a verbatim config file, one replica.
replicaCount: 1
preStopSleepSeconds: 0
drain:
  strategy: immediate
  timeSeconds: 30
terminationGracePeriodSeconds: 60
secret:
  env:
    OPENAI_API_KEY: placeholder
configFile: |
  version: 0
  listen: 0.0.0.0:8080
  admin: 0.0.0.0:9901
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
  routes:
    - model: "*"
      provider: openai
