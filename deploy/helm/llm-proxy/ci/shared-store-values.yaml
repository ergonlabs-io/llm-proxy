# helm lint / helm template coverage: StatefulSet with a shared Redis store.
workload: StatefulSet
replicaCount: 3
config:
  auth:
    hmac_secret: ${LLMPROXY_AUTH_SECRET}
    keys: []
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
  routes:
    - model: "*"
      provider: openai
existingSecret: llm-proxy-env
sharedStore:
  enabled: true
  existingSecret: llm-proxy-redis
