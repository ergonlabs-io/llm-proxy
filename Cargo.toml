[workspace]
resolver = "2"
members = [
    "crates/proxy-api",
    "crates/proxy-config",
    "crates/proxy-core",
    "crates/proxy-http",
    "crates/proxy-cluster",
    "crates/proxy-xds",
    "crates/proxy-observability",
    "crates/proxy-capture-spool",
    "crates/proxy-admin",
    "crates/proxy-filters",
    "crates/proxy-simple-config",
    "crates/proxy",
    "testing/diffrig",
    "testing/corpus",
    "testing/controlplane",
    "testing/loadgen",
    "testing/mockupstream",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
# Local crates
proxy-api = { path = "crates/proxy-api" }
proxy-config = { path = "crates/proxy-config" }
proxy-core = { path = "crates/proxy-core" }
proxy-http = { path = "crates/proxy-http" }
proxy-cluster = { path = "crates/proxy-cluster" }
proxy-xds = { path = "crates/proxy-xds" }
proxy-observability = { path = "crates/proxy-observability" }
proxy-admin = { path = "crates/proxy-admin" }
proxy-filters = { path = "crates/proxy-filters" }
proxy-simple-config = { path = "crates/proxy-simple-config" }

# Async runtime & IO
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
futures = "0.3"
bytes = "1"

# HTTP
http = "1"
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Config / protos (WP-02/WP-03)
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
tonic = "0.12"
tonic-build = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_path_to_error = "0.1"

# TLS (WP-08)
# Rust note: `ring` (not `aws-lc-rs`) is the crypto provider so builds don't
# need a cmake/NASM toolchain; `logging` wires rustls into the `log` facade.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
rcgen = "0.13"
# Rust note: only used to pull Subject Alternative Names out of the raw DER
# rustls hands our verifiers -- pure Rust, no cmake, so it fits alongside the
# `ring` crypto provider choice above.
x509-parser = "0.16"
# Rust note: only used by the `tls_inspector` listener filter to parse a raw
# ClientHello (SNI + ALPN) off the wire before the real TLS handshake runs --
# pure Rust, no cmake, matching the rest of the TLS stack's toolchain choice.
tls-parser = "0.12"

# WP-50 downstream auth: HMAC-SHA256 for virtual-key verification and
# `constant_time::verify_slices_are_equal` for the comparison. Already compiled
# in the tree as rustls's crypto provider, so this is a direct dependency on
# something that was being built anyway -- and it keeps the same "no cmake/NASM
# toolchain" property the rustls feature choice above was made for.
ring = "0.17"
# WP-50 increment 2a-iv (`llm-proxy --mode keygen`): base64url encoding of the
# generated virtual key. Already compiled into the tree as a transitive
# dependency (rcgen, tonic-build, ...), so this promotes an existing build
# artifact to a direct dependency instead of adding new build cost.
base64 = "0.22"

# Utilities
arc-swap = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
rand = "0.8"
core_affinity = "0.8"
socket2 = "0.5"
# Load-generator benchmarking (testing/loadgen): percentile histograms with
# proper multi-thread-friendly recording (`Recorder`/`SyncHistogram`) instead
# of a hand-rolled percentile calculation.
hdrhistogram = "7"
# Access-log `%START_TIME(fmt)%` strftime rendering (WP-24).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Load-generator benchmarking (testing/loadgen): safe `getrlimit` wrapper so
# the driver can log its own fd budget without an `unsafe` FFI call in our
# code -- see `rig.rs`.
rlimit = "0.10"

# WP-50 increment 3b: the embedded, persistent-by-default `ControlPlaneStore`
# (tenants/keys/policies) -- pure-Rust, ACID, single-file, no C toolchain
# (unlike SQLite), matching the "hermetic build" property `rustls`/`ring`
# were chosen for above. See internal-docs/IMPLEMENTATION_PLAN.md's
# "redb data model" section.
redb = "4.2"

# WP-62: the Redis-backed `ControlPlaneStore` -- tier-2 identity/policy plus
# tier-3 spend counters, shared across replicas instead of embedded per
# process (ADR-0006). **Sync connections only, no `tokio-comp`/`aio`
# feature.** The trait this implements is synchronous by design, and
# ADR-0005's rule is that no WORKER ever holds a store connection -- only the
# control runtime's poller and the spend flusher thread call it, both off the
# request path, so there is nothing here for an async runtime to buy. `script`
# is on for `redis::Script`, which `add_spend`'s Lua compare-then-INCRBY needs
# to be atomic (see `control_redis.rs`).
redis = { version = "0.27", features = ["script"] }

# ---------------------------------------------------------------- profiles --
# This section is a DISK-SIZE measure, not a speed one. Say so plainly,
# because the obvious assumption is the opposite.
#
# Measured 2026-08-07 on the dev machine (8 cores, 16 GB RAM):
#   - Adding this section moved a warm `cargo test --workspace` from 705s to
#     675s. That is noise, not a win. On macOS the dev profile defaults to
#     `split-debuginfo = "unpacked"`, so DWARF lives in separate `.o` files
#     and was never inside the executables the test run loads -- test binaries
#     measured ~54 MB before this change and ~52 MB after. Reducing `debug`
#     therefore cannot speed up loading them, and did not.
#   - What it does do is shrink `target/`, which matters here for a specific
#     reason: with 16 GB of RAM and a `target/` that reached 78 GB, the tree
#     cannot be held in page cache, so every cargo invocation re-reads
#     fingerprint metadata from disk. Keeping `target/` small is a standing
#     performance property on this box, not just hygiene.
#
# `line-tables-only` keeps panic backtraces resolving to file and line, and
# drops variable inspection, which nothing on this project has used.
#
# Do NOT add `[build] jobs = N` on the strength of the memory-pressure story:
# it was tried the same day and measured WORSE. Rebuilding after touching
# `proxy-config/src/lower.rs` took 115.77s at `-j 8` versus 164.69s at `-j 4`.
# Halving the job count did cut kernel time (146.53s -> 113.58s, consistent
# with real memory pressure) but cost 42% more wall clock, because the box is
# not thrashing badly enough for serialization to pay.
[profile.dev]
debug = "line-tables-only"

# Measured 2026-08-08: `target/debug/deps` held **1,013,436 `.o` files**, which
# WERE essentially all of the 46 GB (46G / 1.01M ~= 46 KB average; the 1037
# `.rlib` + 2982 `.rmeta` + 44 `.dylib` are rounding error). macOS dev builds
# default to `split-debuginfo = "unpacked"`, so DWARF stays in the object files
# and the linker only records paths to them -- cargo must retain every one --
# and dev's default `codegen-units = 256` multiplies that per crate, per stale
# hash-variant (cargo never GCs those).
#
# The file COUNT hurts twice: 46 GB on a box with 16 GB of RAM, and filesystem
# latency -- a plain `ls -f` of that one directory took ~50 seconds.
codegen-units = 16

# The generated proto tree is machine-written and nobody sets a breakpoint in
# it, so it carries no debuginfo at all. This is the single biggest
# contributor to `target/debug/deps`.
[profile.dev.package.proxy-api]
debug = 0

# `cargo test` builds test targets under `profile.test`, which inherits from
# `dev` but must be set explicitly for the override above to apply to the
# binaries the test run actually builds.
[profile.test]
debug = "line-tables-only"

[profile.test.package.proxy-api]
debug = 0

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
