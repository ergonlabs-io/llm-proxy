[workspace]
resolver = "2"
members = [
    "crates/proxy-api",
    "crates/proxy-config",
    "crates/proxy-core",
    "crates/proxy-http",
    "crates/proxy-cluster",
    "crates/proxy-xds",
    "crates/proxy-observability",
    "crates/proxy-admin",
    "crates/proxy-filters",
    "crates/proxy-simple-config",
    "crates/proxy",
    "testing/diffrig",
    "testing/corpus",
    "testing/controlplane",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
# Local crates
proxy-api = { path = "crates/proxy-api" }
proxy-config = { path = "crates/proxy-config" }
proxy-core = { path = "crates/proxy-core" }
proxy-http = { path = "crates/proxy-http" }
proxy-cluster = { path = "crates/proxy-cluster" }
proxy-xds = { path = "crates/proxy-xds" }
proxy-observability = { path = "crates/proxy-observability" }
proxy-admin = { path = "crates/proxy-admin" }
proxy-filters = { path = "crates/proxy-filters" }
proxy-simple-config = { path = "crates/proxy-simple-config" }

# Async runtime & IO
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
futures = "0.3"
bytes = "1"

# HTTP
http = "1"
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Config / protos (WP-02/WP-03)
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
tonic = "0.12"
tonic-build = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_path_to_error = "0.1"

# TLS (WP-08)
# Rust note: `ring` (not `aws-lc-rs`) is the crypto provider so builds don't
# need a cmake/NASM toolchain; `logging` wires rustls into the `log` facade.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
rcgen = "0.13"
# Rust note: only used to pull Subject Alternative Names out of the raw DER
# rustls hands our verifiers -- pure Rust, no cmake, so it fits alongside the
# `ring` crypto provider choice above.
x509-parser = "0.16"
# Rust note: only used by the `tls_inspector` listener filter to parse a raw
# ClientHello (SNI + ALPN) off the wire before the real TLS handshake runs --
# pure Rust, no cmake, matching the rest of the TLS stack's toolchain choice.
tls-parser = "0.12"

# Utilities
arc-swap = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
rand = "0.8"
core_affinity = "0.8"
socket2 = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
