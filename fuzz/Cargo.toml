# Fuzz targets for the hand-written parsers that read client- or
# provider-controlled bytes. Run with `make fuzz` or `make fuzz-one`.
#
# Deliberately NOT a member of the root workspace: cargo-fuzz needs nightly
# and sanitizer flags, so keeping it out leaves `make tq` and `make ci` on
# stable untouched. The empty `[workspace]` table below makes this its own
# workspace root, so cargo does not try to attach it to the parent.
[package]
name = "llm-proxy-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
bytes = "1"
# Same features as the workspace pin; the access-log target checks a pattern
# with the strftime parser the renderer uses.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
http = "1"
libfuzzer-sys = "0.4"
# `fuzzing` exposes the crate-private entry points in each crate's
# `fuzzing` module; nothing else enables it.
proxy-admin = { path = "../crates/proxy-admin", features = ["fuzzing"] }
proxy-config = { path = "../crates/proxy-config" }
proxy-control = { path = "../crates/proxy-control" }
proxy-filters = { path = "../crates/proxy-filters" }
proxy-http = { path = "../crates/proxy-http", features = ["fuzzing"] }
proxy-observability = { path = "../crates/proxy-observability" }
proxy-simple-config = { path = "../crates/proxy-simple-config", features = ["fuzzing"] }
serde_json = "1"

# Same lint as the root workspace (AGENTS.md invariant 3).
[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "usage_extract"
path = "fuzz_targets/usage_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "body_prefix_scan"
path = "fuzz_targets/body_prefix_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dialect_config"
path = "fuzz_targets/dialect_config.rs"
test = false
doc = false
bench = false

