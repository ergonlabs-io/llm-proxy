    limiting: <code>testing/diffrig/tests/auth_e2e.rs</code>. Unlike v0.0.1 (a manual live run
    against real OpenAI and Anthropic endpoints, executed and recorded), this release was
    tagged <b>without</b> running its live-provider drill. That drill exists — one command,
    three billable calls — and is deliberately not yet run:
    <code>OPENAI_API_KEY=sk-… cargo test -p diffrig --test live_gate_v0_1_0 -- --ignored</code>.
