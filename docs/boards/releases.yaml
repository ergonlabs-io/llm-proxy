# Generated from the published board on 2026-08-01, then hand-maintained.
# Edit this file, then run `make boards` -- never edit the HTML directly.

releases:
- v: v0.0.1
  name: First light
  state: shipped
  # Quoted: bare 2026-08-01 is a YAML `date`, which json.dumps cannot serialize.
  when: "2026-08-01"
  theme: >-
    One request, all the way through, for real. A client calls the proxy; the proxy routes
    it, opens TLS to the upstream gateway, forwards with credentials attached, and returns
    the response intact — streaming included.
  gate: >-
    A chat-completion request, from a single <code>llmproxy</code> config pointed at a real
    provider endpoint, returns the provider's response unmodified — non-streaming <em>and</em>
    streamed SSE — for OpenAI and for Anthropic.
  verify: >-
    OPENAI_API_KEY=… ANTHROPIC_API_KEY=… cargo test -p diffrig --test live_smoke -- --ignored
    — <b>run 2026-08-01 against the real OpenAI and Anthropic endpoints: all 4 cases passed.</b>
    The tests stay <code>#[ignore]</code>d (they bill real tokens and CI holds no keys), so
    the gate evidence is a deliberate manual run, not a CI green.
  done: 16
  open: 3
  scope: >-
    Carries <b>everything built to date</b> — config pipeline, L4, TLS, h1/h2, S1 routing,
    S2 filter chain, S3 retries, S5 breakers, S7 load balancing, access logs, token extraction.
    The features are not the milestone; the working path through them is.
  left:
  - wp: WP-26
    what: >-
      <b>Done — this is what closed the gate.</b> 4 cases (OpenAI and Anthropic, streaming
      and not) run against the real endpoints on 2026-08-01, all passing.
  - wp: WP-13
    what: >-
      The first real provider round-trip exposed <b>nothing</b> — it passed clean on the
      first run. Still open for the lifecycle differential suite, which was never part of
      this gate.
  - wp: WP-15
    what: >-
      Keep-alive reuse — still connect-per-stream. The gate passed without it; 4 requests
      cannot surface it, and a sustained real workload will. Still open, not re-slotted.
  - wp: WP-41
    what: >-
      <b>Black-box QA suite — the new instrument, and it is already paying.</b> Four real
      bugs on day one; three fixed, and QA-1 now passes fully (per-route token values, no
      longer skipping). QA-5/7/8 approved and unbuilt.
  risk: >-
    A great deal of machinery is finished and green without ever having carried a real request.
    That gap is the whole point of this gate — and the QA suite has now made it concrete rather
    than theoretical: on its first run it found that the dialect emitted <b>no access logs
    at all</b>, that <code>%REQ(:METHOD)%</code> always rendered <code>-</code>, and that
    a stream killed mid-flight recorded <b>no response flag</b>. All three were invisible
    from inside the code; one was described as intended in its own doc comment. Expect this
    list to keep growing — that is the instrument working, not a setback. <b>Closed 2026-08-01:</b>
    the live smoke test ran against real OpenAI and Anthropic endpoints and passed all four
    cases on the first attempt — the machinery built without ever carrying a real request
    turned out to carry one correctly. Worth naming honestly: a clean first run is a weaker
    signal than a run that found something, because four requests exercise a narrow path.
    Coverage stays three-tiered (mocks, the local Ollama third-party tier, real providers)
    for exactly that reason.
