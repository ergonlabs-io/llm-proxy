- v: v0.2.0
  name: Production-ready serving
  state: current
  when: in progress
  theme: Stop claiming “performant” without evidence, and be safe to run unattended.
  gate: >-
    A published capacity report (p99, tokens/sec ceiling, RSS under sustained long-lived streams)
    from a run that is <em>not</em> harness-bound, plus <code>/config_dump</code> and <code>/stats</code>
    served by the admin endpoint, plus a config swap under live traffic with zero dropped
    streams.
  done: 1
  open: 8
  left:
  - wp: WP-30
    what: >-
      <b>The capacity report is now the ONLY open gate clause, and the instrument that would
      produce it is fixed and merged — but no report has been published.</b> Phases 1+2 are
      built (open-loop driver, process sampler, capacity table); no ceiling has been published,
      so “performant” is still an untested claim. <b>Found 2026-08-09 while building the swap
      test, FIXED AND MERGED the same day (<code>8d2d891</code>, <code>6ae7266</code>, on
      <code>main</code>, inside <code>make ci</code>'s current 1146):</b>
      <code>loadgen::driver::execute</code> could not detect SSE stream truncation — it
      classified a streaming request as successful once the body ended without a transport
      error, never checking for the terminal frame, so a run in which the proxy truncated every
      stream would have reported a 0% error rate. Now <code>ExecError::Truncated</code>, kept
      distinct from <code>Transport</code>. <b>Found alongside, and the larger of the two:</b>
      every failed request's time-to-failure was feeding the latency percentiles, and it skewed
      the dangerous way — a fast failure LOWERS p99, so a proxy collapsing under load would have
      looked like it was getting faster. Percentiles now cover successful requests only (a
      definition change, flagged on <code>RunSummary</code> and in the printed report). Both
      mutation-verified. <b>What is still open, unchanged: no sweep has actually been run and
      recorded</b> — the instrument is trustworthy now, but zero capacity numbers exist. Separately,
      the Linux <code>/proc</code> sampler is <b>no longer a blocker</b> (owner decision
      2026-08-09) — the gate asks for a run that is not harness-bound, not specifically Linux,
      and the macOS sampler path is the verified one.
  - wp: WP-23
    what: >-
      <b>Increments 1–6a landed 2026-08-08/09 and CLOSE this gate's <code>/stats</code>
      clause.</b> Registry core, histograms with Envoy's default buckets, the Envoy text
      renderer, <code>/stats/prometheus</code> (histogram line format
      <code>P&lt;n&gt;(interval,cumulative)</code>, space-joined, confirmed against Envoy's own
      source), a registry API that survives a config swap (<code>Registry</code> vs
      non-<code>Clone</code> <code>StatsControl</code>, ArcSwap-published snapshot), and
      cluster stat call sites so <code>/stats</code> reports <b>real traffic</b> — proven by
      <code>crates/proxy/tests/stats_e2e.rs</code> and mutation-verified. <b>Not the same claim
      as WP-23 being done:</b> increment 6b (the <code>DOWNSTREAM_CX_TOTAL</code> listener stat
      and the <code>GEN_AI_CLIENT_TOKEN_USAGE</code> usage-filter stat) has instruments defined
      but no production call site yet, so listener- and LLM-token-level stats are still absent
      from a live scrape. The Grafana conformance test stays provisional — the Envoy repo
      vendors no dashboard at all.
  - wp: WP-06
    what: >-
      <b>Done, and CLOSES this gate's config-swap clause.</b> SIGHUP now re-reads the config
      file and publishes a new snapshot (a bad config keeps the old snapshot and logs the
      dotted-path error rather than taking the proxy down); listeners and clusters both
      reconcile. <code>testing/diffrig/tests/swap_under_load.rs</code>: 6 streams in flight at
      the moment of the swap, 12 paced SSE streams all reaching the terminal frame, 50
      non-streaming requests, zero transport errors, zero non-2xx, second upstream serves 48
      requests afterward. The load-bearing assertion is the terminal frame, not a request
      count — this proxy never injects into a truncated SSE stream, so a silent truncation
      would otherwise pass a count-based check. This did NOT need WP-26's docker traffic
      topology, contrary to what this card said as recently as 2026-08-06.
  - wp: WP-50
    what: >-
      <b>Operator control plane — absorbs the old WP-25 slot.</b> Increment 1 (2026-08-02,
      9df7deb): <code>/ready</code>, <code>/config_dump</code>, <code>/clusters</code>,
      <code>/server_info</code>, with <code>/config_dump</code> redaction structural (the dump
      type has no field that can hold a live credential). Increment 2a landed 2026-08-08
      (downstream authentication: proxy-issued virtual keys, keyed HMAC-SHA-256 verified in
      constant time, fail-closed, an <code>Authenticator</code> trait chain so OIDC lands later
      without reshaping anything, an <code>auth:</code> dialect block, <code>llm-proxy --mode
      keygen</code>) — this is what let WP-34's token limit re-key onto a proxy-assigned
      identity and become the v0.1.0 gate's last verified clause. <b>Remaining: increment 2b
      (persistent/shared key store — keys are in-memory and config-only today), 2c (OIDC), and
      increment 3 (tenants, per-tenant model allow-lists, budgets, spend history, admin
      CRUD).</b> Nothing landed here today.
  - wp: WP-18
    what: >-
      Health checking is built and green (64 tests) but <b>not reachable from config</b> —
      <code>ClusterConfig</code> has no field for it. Nothing landed here today.
  - wp: WP-19
    what: >-
      Outlier detection, same story: 78 tests green, no IR wiring. Nothing landed here today.
  - wp: WP-42
    what: >-
      <b>Spend controls & budgets.</b> New from the 2026-08-01 competitive review — and <i>not</i>
      WP-34's token rate limits: a tokens/minute cap is a throttle, not a budget. Nothing
      else in the plan says "this key may spend $X, then stop." <b>Now formally blocked on
      WP-53</b> (see below) — a dollar budget cannot be enforced against a price list nobody
      can update.
  - wp: WP-53
    what: >-
      <b>New card this refresh — was already in the plan (added 2026-08-08) but missing from
      this board.</b> Versioned model pricing, the rate card WP-42 depends on. Design brief
      only (<code>docs/wp-53-pricing-design-brief.md</code>); no registry or filter code is
      merged on <code>main</code>. Core decision: cost is computed and recorded at request
      time and never re-priced on read, so a price update can't change an already-completed
      request's bill.
  - wp: WP-51
    what: >-
      OpenTelemetry (traces, metrics, semconv naming). Scheduled 2026-08-03, not started — the
      naming decision it forced is why WP-23's registry above is OTel-native rather than
      Envoy-first. Nothing landed here today.
  risk: >-
    <b>Two of the three gate clauses closed 2026-08-09; the capacity report is now the only
    one open, and its blocker is cleared but nothing has been published yet.</b>
    <code>/config_dump</code> and <code>/stats</code> on the admin endpoint: closed —
    <code>/stats</code> now reports real traffic (<code>crates/proxy/tests/stats_e2e.rs</code>),
    not merely a correctly-rendered empty registry, and <code>/config_dump</code>'s redaction is
    structural. A config swap under live traffic with zero dropped streams: closed —
    <code>testing/diffrig/tests/swap_under_load.rs</code>, real SIGHUP trigger, real traffic,
    zero transport errors, zero non-2xx, and the load-bearing check is the SSE terminal frame
    rather than a request count. <b>A defect was then found IN that already-closed
    <code>/config_dump</code> clause, and it is worth stating plainly rather than quietly
    patching over: 2026-08-09 (<code>ddbda3c</code>), found by writing user documentation
    against the code, not by a test — the admin server built its own config handle outside the
    list the publisher actually walks, so <code>/config_dump</code> and <code>/clusters</code>
    kept serving the BOOT snapshot forever, including across a real reload.</b> Fixed
    structurally (a <code>SnapshotHandles</code> registry that enrolls a handle at the same time
    it hands one out) and verified end to end: real binary, real SIGHUP, HTTP response bytes
    asserted to change. A follow-up (<code>b936a7f</code>) made the original bug unconstructible
    rather than merely discouraged. <b>The capacity report's blocker is now cleared, but the
    report itself still does not exist.</b> <code>loadgen::driver::execute</code> could not
    detect SSE stream truncation — found 2026-08-09, <b>fixed and merged the same day</b>
    (<code>8d2d891</code>, <code>6ae7266</code>, on <code>main</code>) — and a second, larger
    defect alongside it: every failed request's time-to-failure was feeding the latency
    percentiles, so a proxy collapsing under load would have measured as getting <i>faster</i>.
    Both mutation-verified, percentiles now cover successful requests only. <b>What remains open
    is unglamorous: no sweep has actually been run.</b> Zero p99/tokens-per-sec/RSS numbers are
    published against the fixed instrument. The Linux <code>/proc</code> sampler is unverified
    but is <b>not treated as blocking</b> — owner decision 2026-08-09, the gate asks for a run
    that is not harness-bound, not specifically Linux, and the macOS sampler path is the
    verified one. What IS still open on that clause is WP-15 connection reuse: h2 got a
    per-worker multiplexed cache, but h1 remains connect-per-stream and still burns two
    ephemeral ports per request, which is what actually caps the rig near ~8k streams.
    <b>A live run against a local Ollama (2026-08-14) found two real defects that 1141 passing
    tests had not</b> — the QA suite's lesson repeating outside the QA suite. One is fixed: a
    successful content-length-framed 200 was logged <code>response_flags: DC</code> because
    hyper stops polling the body once the declared length is written, so <code>LoggingBody</code>
    never saw its own clean end (<code>326c6ed</code>); verified before/after against real
    Ollama. <b>Why no mock caught it: <code>mock_e2e.rs</code> never configures
    <code>access_logs</code> at all</b>, so no test in that suite has ever inspected a rendered
    log line — the only place real access logging meets real per-route dialect resolution is
    <code>local_openai_smoke.rs</code>, which is <code>#[ignore]</code>d behind a local Ollama
    and had evidently not run since WP-45 landed. The second is a <b>confirmed quota bypass, now
    visible but still open by design</b>: with a budget configured, six ~16-token requests
    against a 20-token/minute limit produced zero 429s, because the limiter read no usage and
    said nothing (<code>a3a8c14</code>). Owner decision was to warn loudly rather than fail
    closed — the bypass is now logged (at most once per budget key per minute) but the request
    is still admitted uncharged. <b>Root cause is architectural, not a simple bug, and is
    recorded against WP-35/WP-52:</b> <code>body_rewrite</code> overwrites the model header from
    the request body and clears the route cache (deliberate anti-spoofing), so a request can
    land on a different route than the one that first matched, and the usage dialect — which
    still lives on the route — silently follows. Three tests in <code>local_openai_smoke.rs</code>
    fail for exactly this reason today (4 of 7 pass); they are correct tests blocked on unbuilt
    functionality, not broken ones. The fix is a prerequisite already written into
    <code>IMPLEMENTATION_PLAN.md</code>'s WP-35 section: the usage dialect must move from the
    route onto the cluster <i>before</i> WP-52 makes cross-dialect fallback legal, or this
    reproduces the credentials/<code>host_rewrite_literal</code> P0 shape with silently wrong
    billing as the symptom. <b>Also landed, not gate-moving:</b> Apache-2.0 licensing
    (<code>LICENSE</code>, <code>NOTICE</code> with a 242-crate dependency audit — all
    permissive, zero copyleft, six needing attribution texts bundled before any binary release
    — and <code>SECURITY.md</code>), a README rewritten against the actual code, and every
    user-facing Envoy reference removed (the docs site, the JSON schema, strict-mode error
    messages, <code>--help</code>, the examples) with the configuration now called
    <i>the configuration</i> rather than a dialect; the Starlight docs site grew from a
    three-page scaffold to the nine pages it now actually serves. None of this touches a gate
    clause. <b>It does surface a distinct, unscheduled punch list for any actual public
    release: no git remote yet (owner is handling), no release workflow or published binaries,
    the six dependencies' license texts are recorded as owed but not yet bundled, and
    <code>SECURITY.md</code>'s reporting contact is still unfilled.</b> None of these are work
    packages today; flagged here rather than invented as one. <b>Test-suite note, reconciled
    this refresh:</b> full workspace is <b>1146 tests passed, 24 skipped</b> (<code>cargo
    nextest</code>, re-run directly via <code>make tq-count</code>, plus <code>cargo fmt
    --check</code>, <code>cargo clippy -D warnings</code>, <code>make tq-doc</code>, and
    <code>make qa</code> all independently re-run clean) — up from 1130/24 at the last refresh.
    The +16 reconciles exactly against every commit's own self-reported count since then: +6
    (loadgen truncation-detection tests), +5 (the <code>/config_dump</code>/drain-strategy fix's
    <code>reload.rs</code> and new <code>drain_strategy_warning.rs</code>), +1 (the DC-on-200
