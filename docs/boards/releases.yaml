# Generated from the published board on 2026-08-01, then hand-maintained.
# Edit this file, then run `make boards` -- never edit the HTML directly.

releases:
- v: v0.0.1
  name: First light
  state: shipped
  # Quoted: bare 2026-08-01 is a YAML `date`, which json.dumps cannot serialize.
  when: "2026-08-01"
  theme: >-
    One request, all the way through, for real. A client calls the proxy; the proxy routes
    it, opens TLS to the upstream gateway, forwards with credentials attached, and returns
    the response intact — streaming included.
  gate: >-
    A chat-completion request, from a single <code>llmproxy</code> config pointed at a real
    provider endpoint, returns the provider's response unmodified — non-streaming <em>and</em>
    streamed SSE — for OpenAI and for Anthropic.
  verify: >-
    OPENAI_API_KEY=… ANTHROPIC_API_KEY=… cargo test -p diffrig --test live_smoke -- --ignored
    — <b>run 2026-08-01 against the real OpenAI and Anthropic endpoints: all 4 cases passed.</b>
    The tests stay <code>#[ignore]</code>d (they bill real tokens and CI holds no keys), so
    the gate evidence is a deliberate manual run, not a CI green.
  done: 16
  open: 3
  scope: >-
    Carries <b>everything built to date</b> — config pipeline, L4, TLS, h1/h2, S1 routing,
    S2 filter chain, S3 retries, S5 breakers, S7 load balancing, access logs, token extraction.
    The features are not the milestone; the working path through them is.
  left:
  - wp: WP-26
    what: >-
      <b>Done — this is what closed the gate.</b> 4 cases (OpenAI and Anthropic, streaming
      and not) run against the real endpoints on 2026-08-01, all passing.
  - wp: WP-13
    what: >-
      The first real provider round-trip exposed <b>nothing</b> — it passed clean on the
      first run. Still open for the lifecycle differential suite, which was never part of
      this gate.
  - wp: WP-15
    what: >-
      Keep-alive reuse — still connect-per-stream. The gate passed without it; 4 requests
      cannot surface it, and a sustained real workload will. Still open, not re-slotted.
  - wp: WP-41
    what: >-
      <b>Black-box QA suite — the new instrument, and it is already paying.</b> Four real
      bugs on day one; three fixed, and QA-1 now passes fully (per-route token values, no
      longer skipping). QA-5/7/8 approved and unbuilt.
  risk: >-
    A great deal of machinery is finished and green without ever having carried a real request.
    That gap is the whole point of this gate — and the QA suite has now made it concrete rather
    than theoretical: on its first run it found that the dialect emitted <b>no access logs
    at all</b>, that <code>%REQ(:METHOD)%</code> always rendered <code>-</code>, and that
    a stream killed mid-flight recorded <b>no response flag</b>. All three were invisible
    from inside the code; one was described as intended in its own doc comment. Expect this
    list to keep growing — that is the instrument working, not a setback. <b>Closed 2026-08-01:</b>
    the live smoke test ran against real OpenAI and Anthropic endpoints and passed all four
    cases on the first attempt — the machinery built without ever carrying a real request
    turned out to carry one correctly. Worth naming honestly: a clean first run is a weaker
    signal than a run that found something, because four requests exercise a narrow path.
    Coverage stays three-tiered (mocks, the local Ollama third-party tier, real providers)
    for exactly that reason.
- v: v0.1.0
  name: LLM gateway
  state: shipped
  when: "2026-08-08"
  theme: >-
    The reason this project exists — be a gateway a team chooses <em>because</em> it understands
    LLM traffic.
  gate: >-
    Per-request token counts (input / cache-read / cache-write / output) and TTFT/TPOT reach
    the access log for live traffic; a token-based rate limit is enforced; and the proxy fails
    over from one provider to another without the client seeing an error.
  verify: >-
    All three clauses verified end to end against the real binary over real sockets —
    <b>against mock upstreams, not real providers.</b> Token counts + TTFT/TPOT: QA-1 and
    QA-10. Provider failover: <code>testing/diffrig/tests/failover_e2e.rs</code>. Token rate
    limiting: <code>testing/diffrig/tests/auth_e2e.rs</code>. Unlike v0.0.1 (a manual live run
    against real OpenAI and Anthropic endpoints, executed and recorded), this release was
    tagged <b>without</b> running its live-provider drill. That drill exists — one command,
    three billable calls — and is deliberately not yet run:
    <code>OPENAI_API_KEY=sk-… cargo test -p diffrig --test live_gate_v0_1_0 -- --ignored</code>.
    Recorded as a departure from the v0.0.1 standard in <code>docs/MILESTONES.md</code>, not
    folded into the gate text.
  done: 4
  open: 5
  left:
  - wp: WP-35
    what: >-
      <b>Done 2026-08-07/08 (cb84f83, a2bfef7, d4ac161, 399b954), and VERIFIED END TO END
      2026-08-08 (c1314b6) — the gate's third clause is no longer just code-complete.</b> The
      aggregate cluster (member-order failover via <code>attempted_clusters</code>, a host pick
      that yields its owning member) is reachable from both front-ends: Envoy-mode
      <code>cluster_type</code>, and the dialect's <code>fallbacks:</code> key, which now lowers
      for real instead of warning and dropping. <code>validate_cluster_graph</code> rejects a
      missing/self/nested/duplicate member at config time with a dotted path.
      <code>testing/diffrig/tests/failover_e2e.rs</code> now drives the real binary end to end
      against a mock forced to 429: exact attempt accounting, the credential-isolation negative
      (standby's key only, primary's key nowhere on the wire), and the standby's own Host header
      — all three mutation-tested. <b>Scope note: this is SAME-DIALECT fallback only.</b>
      Cross-dialect (openai → anthropic) is a deliberate hard error, split into new WP-52
      (v1.0.0) rather than silently left undone inside this WP.
  - wp: WP-48
    what: >-
      <b>Done 2026-08-07 (41f1c59), re-scoped by its own audit.</b> No live overflow bug existed
      outside <code>usage.rs</code>. The real defect: <code>as_u64()</code> returns
      <code>None</code> for a JSON float, so a provider reporting <code>150.0</code> output
      tokens billed as zero, silently. Fixed at all 5 call sites through one helper.
  - wp: WP-46
    what: >-
      Done 2026-08-02 (9b68eac), and the gap that left it unusable through the product's own
      front door FIXED and VERIFIED 2026-08-08 (b0485e8). <code>%LLM_TPOT%</code>,
      <code>%LLM_MAX_STALL%</code>, and <code>%LLM_RESPONSE_CHUNKS%</code> existed since
      08-02, but <b>neither <code>llmproxy</code> dialect log format (text or JSON) ever
      emitted them</b> — a completeness gap in this WP's original delivery, found while
      building the verification for it. Both formats now carry all three. New QA-10 proves it
      end to end against a mock with known pacing (400ms TTFT / 150ms inter-chunk observed as
      ttft=402ms, tpot=122.129ms, max_stall=152ms) and caught a live bug in the same pass:
      <code>%LLM_RESPONSE_CHUNKS%</code> over-counted by exactly one on every response with a
      body (a synthetic end-of-stream frame timed as a chunk), also fixed.
  - wp: WP-45
    what: >-
      Done 2026-08-05 (872b7d7) — all 6 acceptance criteria met. Consumer B (body-based model
      routing) reads <code>model</code> from the real request body instead of a
      client-controlled header, closing a privilege-escalation surface.
  - wp: WP-49
    what: >-
      Backend taxonomy. Increment 1 done 2026-08-02 (caccc5f) — the <code>models:</code>
      catalogue. <b>Remaining:</b> wildcard model names + trie, then the OAuth/SigV4 credential
      schemes Vertex/Bedrock need — those must run after WP-45's body rewrite and cannot be
      header injection, and there is no hook for that today.
  - wp: WP-47
    what: >-
      <b>Increment 1 landed 2026-08-08 (4171c8d) — the vendoring itself, not the migration.</b>
      <code>llmproxy/filters/v0/auth.proto</code> is the first config message this project
      defines rather than borrows, compiled into the descriptor pool and parsed by
      <code>llmproxy.auth</code> (WP-50). <b>The three pre-existing filters (usage,
      body_rewrite, token_limit) still borrow unrelated Envoy messages for their
      <code>typed_config</code> and are untouched</b> — migrating them is still this WP's open
      work; this increment only stopped a fourth borrow from being needed.
  - wp: WP-34
    what: >-
      <b>Verified end to end 2026-08-08
      (<code>testing/diffrig/tests/auth_e2e.rs::two_virtual_keys_on_the_same_tenant_share_one_token_budget</code>),
      and the correction matters more than the pass.</b> The limiter itself was built earlier
      and looked sufficient — 429 + <code>x-ratelimit-*</code>, mutation-tested at the unit
      level — but it bucketed on <code>hash_credential(&lt;the client's own Authorization
      header&gt;)</code>, which nothing verified: a caller who exhausted their quota could
      change one string and get a fresh one. WP-50 increment 2a re-keyed it onto
      <code>Principal.tenant</code>, an identity the proxy itself assigns, which is what makes
      the drill mean something. Mutation-checked: reverting the tenant read turns a 429 into a
      200. <b>Remaining, not gate-blocking:</b> per-descriptor config beyond a single (route,
      credential) bucket, blocked on WP-47's filter migration.
  - wp: WP-33
    what: >-
      Usage filter wired per-route into the llmproxy dialect. <b>Remaining:</b> GenAI metrics
      per OTel semconv (distinct from WP-46's access-log fields, which are done) and the
      route-level <code>streaming: strict</code> assertion.
  - wp: WP-14
    what: >-
      Hedging, S5.2 retry budgets, previously-attempted-host predicate. WP-35's failover
      shipped on this engine as already built — 429-as-retriable and
      never-retry-after-first-byte needed no new mechanism here.
  risk: >-
    <b>Shipped 2026-08-08 with all three gate clauses verified end to end — against mock
    upstreams, not real providers, and that is the residual caveat, not a footnote.</b> Token
    counts + TTFT/TPOT: closed and verified since 2026-08-08 (QA-1, QA-10). Provider failover:
    verified by <code>testing/diffrig/tests/failover_e2e.rs</code> against a mock forced to
    429. Token-based rate limiting: verified last, on the same day, by
    <code>testing/diffrig/tests/auth_e2e.rs</code> — and only <em>became</em> verifiable once
    WP-50 increment 2a gave the limiter a proxy-assigned identity to key on; before that, the
    obvious drill would have measured a client against a bucket it was free to abandon by
    changing its own header. <b>v0.0.1 shipped on a manual live run against real OpenAI and
    Anthropic endpoints, executed and recorded; this release did not.</b> The live drill exists
    (<code>testing/diffrig/tests/live_gate_v0_1_0.rs</code>, one command, three billable calls)
    and was deliberately not run before tagging — recorded in <code>docs/MILESTONES.md</code> as
    a departure from the v0.0.1 standard, not a gap that was missed. For failover and rate
    limiting the mock arguably exercises the failure path better than a real provider would on
    demand (forcing a 429, exhausting a budget), but that is an argument, not the standard the
    previous release met. <b>WP-35's own scope closed narrower than its title suggests:</b>
    same-dialect fallback only. Cross-dialect (openai → anthropic) is a deliberate hard error at
    config time, not silently unsupported — the translation work it would need is real and
    un-started, and is now WP-52 (v1.0.0), not a loose end inside this WP. <b>Second risk, named
    2026-08-01, unchanged:</b> the LLM layer is stacking on <em>serving</em> foundations that are
    not finished — no connection pooling (WP-15, still connect-per-stream), no downstream h2
    (WP-10), and watermarks aliased to buffering rather than real backpressure (WP-11). None of
    those three are exercised by the tests that closed this gate's clauses, and all three bite
    under concurrency, sustained streams, or a slow consumer. <b>Third risk, updated
    2026-08-08:</b> the workspace suite is <b>1045 tests green, 24 skipped</b>
    (<code>cargo nextest</code>, a real re-run, not carried forward — up from 968/21 at the last
    refresh, which this batch's volume of landed work explains). The <code>diffrig</code> hang
    mitigation (multi-threaded runtime + <code>terminate-after</code>) holds; the underlying
    tests still carry no request timeouts, unchanged. <b>Fourth, closed this pass:</b> the
    <code>cli.rs</code> drain test once suspected flaky-on-timing was root-caused as a fixed-port
    collision (<code>f5f6fc9</code>) and given its own ephemeral port — 12/12 clean re-runs, and
    3/3 with both old fixed ports deliberately held by another process.
- v: v0.2.0
  name: Production-ready serving
  state: current
  when: in progress
  theme: Stop claiming “performant” without evidence, and be safe to run unattended.
  gate: >-
    A published capacity report (p99, tokens/sec ceiling, RSS under sustained long-lived streams)
    from a run that is <em>not</em> harness-bound, plus <code>/config_dump</code> and <code>/stats</code>
    served by the admin endpoint, plus a config swap under live traffic with zero dropped
    streams.
  done: 0
  open: 8
  left:
  - wp: WP-30
    what: >-
      The sweep itself. Phases 1+2 are built; no ceiling has been published, so <b>“performant”
      is still an untested claim</b>.
  - wp: WP-23
    what: >-
      Stats registry with Envoy names — also owns the two inert <code>stat_prefix</code> fields
      the readership guard flags. <b>Design brief landed 2026-08-08
      (<code>docs/wp-23-stats-design-brief.md</code>, commit 83c778f)</b> — OTel-native model,
      hot path increments an index not a name, stats explicitly NOT ADR-0005's distributed case
      (each replica reports its own; pre-aggregating would break <code>rate()</code> on restart).
      Design only — no registry code yet, and it still needs WP-06.
  - wp: WP-50
    what: >-
      <b>Operator control plane — absorbs the old WP-25 slot.</b> Increment 1 (2026-08-02,
      9df7deb): <code>/ready</code>, <code>/config_dump</code>, <code>/clusters</code>,
      <code>/server_info</code>, with <code>/config_dump</code> redaction structural (the dump
      type has no field that can hold a live credential). <code>/stats</code> still 404s naming
      WP-23 rather than faking an empty 200 — so this gate's admin clause is half real, half
      still WP-23. <b>Increment 2a landed 2026-08-08</b> (downstream authentication: proxy-issued
      virtual keys, keyed HMAC-SHA-256 verified in constant time, fail-closed, an
      <code>Authenticator</code> trait chain so OIDC lands later without reshaping anything, an
      <code>auth:</code> dialect block, <code>llm-proxy --mode keygen</code>) — this is what
      let WP-34's token limit re-key onto a proxy-assigned identity and become the v0.1.0 gate's
      last verified clause. <b>Remaining: increment 2b (persistent/shared key store — keys are
      in-memory and config-only today), 2c (OIDC), and increment 3 (tenants, per-tenant model
      allow-lists, budgets, spend history, admin CRUD).</b>
  - wp: WP-18
    what: >-
      Health checking is built and green (64 tests) but <b>not reachable from config</b> —
      <code>ClusterConfig</code> has no field for it.
  - wp: WP-19
    what: 'Outlier detection, same story: 78 tests green, no IR wiring.'
  - wp: WP-06
    what: The swap-under-load gate — the only thing keeping Lane B open.
  - wp: WP-42
    what: >-
      <b>Spend controls & budgets.</b> New from the 2026-08-01 competitive review — and <i>not</i>
      WP-34's token rate limits: a tokens/minute cap is a throttle, not a budget. Nothing
      else in the plan says "this key may spend $X, then stop."
  - wp: WP-51
    what: >-
      OpenTelemetry (traces, metrics, semconv naming). Scheduled 2026-08-03, not started — the
      naming decision it forced is why WP-23's registry above is OTel-native rather than
      Envoy-first.
  risk: >-
    <b>Now the current milestone (v0.1.0 shipped 2026-08-08); stated honestly, each gate
    clause is at a different stage, and none is closed.</b> <code>/config_dump</code> works
    today (redaction is structural, not a filter that can be forgotten). <code>/stats</code>
    returns a 404 that explicitly names the reason —
    <code>"not implemented yet (WP-23: stats registry); this proxy does not fake an empty
    /stats"</code> — rather than a silently-empty 200. The capacity report has no ceiling
    published yet (WP-30 phases 1+2 only). The config-swap-under-load clause has no evidence
    either way. <b>The loadgen Linux <code>/proc</code> sampler is written to spec but
    unverified — there is no Linux box in the loop.</b> That is a blocker for this gate, not a
    footnote. <b>One named gap closed, worth recording since <code>docs/MILESTONES.md</code>
    carried it as open:</b> the drain test (<code>sigterm_drains_then_exits_cleanly</code>)
    suspected flaky-on-timing was root-caused 2026-08-08 as a fixed-port collision, not a
    timing bug — fixed by giving it its own ephemeral port (<code>f5f6fc9</code>), verified
    12/12 clean re-runs plus 3/3 with both old fixed ports deliberately held by another
    process.
