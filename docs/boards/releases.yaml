  gate: >-
    The config-corpus scorecard clears 80% accept on real-world Envoy configs (baseline 15%),
    with zero <em>bug-we-accept</em> results in the differential run against Envoy v1.38.0.
  done: 0
  open: 7
  left:
  - wp: WP-27
